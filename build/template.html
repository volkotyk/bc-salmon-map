<style>
/*__LEAFLET_CSS__*/
:root{
  --ink:#16272c; --ink-2:#4a5d62; --ink-3:#7b8b8f;
  --paper:#f4f6f3; --panel:#ffffff; --line:#d7dfdc; --focus:#0b5563;
  --sea:#c3d6dd; --land:#eceee6; --land-edge:#b9c4bf; --us:#e2e1da; --lake:#b2cdd6; --river:#8fb3c0;
  --road:#ffffff; --road-case:#c9d0c8; --road-mw:#f2c46a; --road-mw-case:#cf9a3c; --road-minor:#d8ddd5;
  --label:#3b4c50; --park:#4f7a4a; --halo:#ffffff;
  --c-chinook:#c2410c; --c-coho:#1d6fb8; --c-both:#7a3e9d; --c-chum:#2e7d4f; --c-pink:#c2367a; --c-sockeye:#a61b1b;
  --c-release:#b58a00; --c-closed:#95a0a0; --c-fraser:#b42318;
  --chip-bg:#eef2f0;
  --tile-filter:none;
  --f-display:"Fira Sans Extra Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Fira Sans","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"Fira Mono",Consolas,"DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#e3ecea; --ink-2:#a9b9b7; --ink-3:#7c8c8b;
    --paper:#0e1719; --panel:#142124; --line:#26383b; --focus:#6cc3cf;
    --sea:#0c1d24; --land:#1b2927; --land-edge:#2f4340; --us:#172220; --lake:#12303a; --river:#2c5866;
    --road:#3a4a47; --road-case:#1f2c2a; --road-mw:#8c6b2c; --road-mw-case:#5a4520; --road-minor:#2c3a37;
    --label:#b7c6c4; --park:#8fbf88; --halo:#0e1719;
    --c-chinook:#f08a4b; --c-coho:#5aa9e6; --c-both:#c08be0; --c-chum:#6fcf97; --c-pink:#f07fb4; --c-sockeye:#f28b82;
    --c-release:#e3c04b; --c-closed:#5e6b6b; --c-fraser:#f2786d;
    --chip-bg:#1c2c2f;
    --tile-filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#e3ecea; --ink-2:#a9b9b7; --ink-3:#7c8c8b;
  --paper:#0e1719; --panel:#142124; --line:#26383b; --focus:#6cc3cf;
  --sea:#0c1d24; --land:#1b2927; --land-edge:#2f4340; --us:#172220; --lake:#12303a; --river:#2c5866;
  --road:#3a4a47; --road-case:#1f2c2a; --road-mw:#8c6b2c; --road-mw-case:#5a4520; --road-minor:#2c3a37;
  --label:#b7c6c4; --park:#8fbf88; --halo:#0e1719;
  --c-chinook:#f08a4b; --c-coho:#5aa9e6; --c-both:#c08be0; --c-chum:#6fcf97; --c-pink:#f07fb4; --c-sockeye:#f28b82;
  --c-release:#e3c04b; --c-closed:#5e6b6b; --c-fraser:#f2786d;
  --chip-bg:#1c2c2f;
  --tile-filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.6);

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--f-body)}
.app{display:grid;grid-template-columns:minmax(320px,400px) 1fr;height:100%}
.panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:20px 20px 28px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font:600 12px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h1{font:700 34px/1.02 var(--f-display);margin:4px 0 6px;text-wrap:balance;letter-spacing:-.005em}
.lede{color:var(--ink-2);margin:0;max-width:60ch}
.lede a,.foot a,.pop a,details a{color:var(--focus)}
.ctl{display:flex;flex-direction:column;gap:8px}
.ctl-label{font:600 13px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.species{display:flex;flex-wrap:wrap;gap:6px}
.species input{position:absolute;opacity:0;pointer-events:none}
.species label{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--panel);font-weight:500;user-select:none}
.species label small{color:var(--ink-3);font-size:11px;font-weight:400}
.species input:checked+label{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.species input:checked+label small{color:inherit;opacity:.7}
.species input:focus-visible+label{outline:2px solid var(--focus);outline-offset:2px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.dot.off{background:none;border:1.5px solid var(--c-closed)}
.dot.sq{border-radius:2px;opacity:.75}
.daterow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=date]{font:500 14px var(--f-mono);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
button{font:500 13px var(--f-body);padding:7px 11px;border:1px solid var(--line);border-radius:6px;background:var(--chip-bg);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--ink-3)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.summary{font:500 15px/1.35 var(--f-body);margin:0}
.summary b{font-family:var(--f-mono);font-weight:500}
.banner{border-left:3px solid var(--c-fraser);background:var(--chip-bg);padding:10px 12px;border-radius:0 6px 6px 0;color:var(--ink);margin:0}
.groups{display:flex;flex-direction:column;gap:16px}
.group h2{font:600 15px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.group ul{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:12px 1fr;gap:4px 10px;align-items:start;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 6px;color:inherit}
.item:hover{background:var(--chip-bg)}
.item .dot{margin-top:5px}
.item .nm{font-weight:600}
.item .nm small{font:400 12px var(--f-mono);color:var(--ink-3);margin-left:6px}
.item .lim{grid-column:2;color:var(--ink-2);font-size:13px}
.item.is-off .nm{color:var(--ink-3);font-weight:500}
.item.is-off .lim{color:var(--ink-3)}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font:600 15px var(--f-display);letter-spacing:.04em;text-transform:uppercase}
details h3{font:600 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 0}
details ul{padding-left:18px;margin:8px 0 0;color:var(--ink-2)}
details li{margin-bottom:6px}
.foot{font-size:12px;color:var(--ink-3);margin:0}
.mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:var(--sea)}
.legend{position:absolute;left:12px;bottom:26px;z-index:500;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12.5px;box-shadow:0 2px 10px rgba(0,0,0,.12);max-width:calc(100% - 24px)}
.legend summary{cursor:pointer;font:600 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:6px}
.legend summary::-webkit-details-marker{display:none}
.legend summary::before{content:'';width:0;height:0;border:5px solid transparent;border-left-color:currentColor;transition:transform .15s}
.legend[open] summary::before{transform:rotate(90deg) translateX(2px)}
.legend[open] summary{margin-bottom:8px}
#legend-body{display:flex;flex-direction:column;gap:6px}
.legend .row{display:flex;align-items:center;gap:8px}
.legend .sw{width:26px;height:0;border-top:5px solid var(--c);flex:none;border-radius:3px}
.legend .sw.dash{border-top-style:dashed;border-top-width:3px}
.legend .sw.thin{border-top-width:2px}
.legend .sw.fill{height:12px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 28%,transparent);border-radius:2px}
.legend .hint{color:var(--ink-3);font-size:11.5px;border-top:1px solid var(--line);padding-top:6px}
.leaflet-container{font-family:var(--f-body);background:var(--sea)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);box-shadow:0 4px 18px rgba(0,0,0,.25)}
.leaflet-popup-content{margin:14px 16px;min-width:240px;max-width:340px;font-size:13px;line-height:1.4}
.leaflet-container a.leaflet-popup-close-button{color:var(--ink-3)}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-bar a:hover{background:var(--chip-bg);color:var(--ink)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--ink-3)}
.leaflet-control-attribution a{color:var(--ink-2)}
.leaflet-tooltip{background:var(--panel);color:var(--ink);border-color:var(--line);font:600 13px var(--f-body)}
.lbl{white-space:nowrap;pointer-events:none;display:none}
.town{font:500 12px/1 var(--f-body);color:var(--label);text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 2px var(--halo)}
.town.r8{font-weight:600;font-size:13px}
.town.r13{font-size:11px;color:var(--ink-3)}
.park{font:italic 500 11.5px/1 var(--f-body);color:var(--park);text-shadow:0 0 3px var(--halo),0 0 3px var(--halo)}
.district{font:600 15px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);text-shadow:0 0 4px var(--halo),0 0 4px var(--halo);opacity:.85}
.district.us{letter-spacing:.3em}
.sublbl{font:500 11px/1 var(--f-mono);color:var(--ink-2);text-shadow:0 0 3px var(--halo),0 0 3px var(--halo)}
.zg8 .m8,.zg9 .m9,.zg10 .m10,.zg11 .m11,.zg12 .m12,.zg13 .m13,.zg14 .m14{display:block}
.tiles-on .town,.tiles-on .park{display:none!important}
.tiles-on .leaflet-tile-pane{filter:var(--tile-filter)}
.pop h3{font:700 20px/1.05 var(--f-display);margin:0 0 2px}
.pop .tag{display:inline-block;font:500 11.5px var(--f-mono);background:var(--chip-bg);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin:2px 0 6px}
.pop .sec{color:var(--ink-2);margin:0 0 8px}
.pop table{border-collapse:collapse;width:100%;font-size:12.5px}
.pop td{padding:4px 6px 4px 0;vertical-align:top;border-top:1px solid var(--line)}
.pop td.d{font-family:var(--f-mono);white-space:nowrap;color:var(--ink-2);font-size:12px}
.pop tr.now td{font-weight:600;color:var(--ink)}
.pop tr.now td.d{color:var(--ink)}
.pop tr.now td:first-child{box-shadow:inset 3px 0 0 var(--c);padding-left:7px}
.pop .sp{font-weight:600;white-space:nowrap}
.pop .subh{font:600 12px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:10px 0 2px}
.pop .note{color:var(--ink-2);margin:8px 0 0;font-size:12.5px}
.route{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.route .street{color:var(--ink-2)}
.route .ll{font:500 12px var(--f-mono);color:var(--ink-3);user-select:all}
.route a{font-weight:600}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto;height:auto}
  .mapwrap{order:-1;height:62svh;min-height:380px}
  .panel{border-right:0;border-top:1px solid var(--line);overflow:visible;padding:18px 16px 28px}
  h1{font-size:30px}
  .legend{bottom:22px;left:8px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.lang button{border:0;border-radius:0;padding:4px 9px;font:600 12px var(--f-mono);background:var(--panel);color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
</style>

<div class="app">
  <aside class="panel">
    <header>
      <div class="topline">
        <div class="eyebrow" id="t-eyebrow"></div>
        <div class="lang" role="group" aria-label="Language / Мова">
          <button type="button" data-lang="uk" lang="uk">UA</button>
          <button type="button" data-lang="en" lang="en">EN</button>
        </div>
      </div>
      <h1 id="t-h1"></h1>
      <p class="lede" id="t-lede"></p>
    </header>

    <div class="ctl">
      <span class="ctl-label" id="sp-label"></span>
      <div class="species" role="radiogroup" aria-labelledby="sp-label" id="species"></div>
    </div>

    <div class="ctl">
      <label class="ctl-label" for="date" id="date-label"></label>
      <div class="daterow">
        <input type="date" id="date">
        <button type="button" id="today"></button>
      </div>
    </div>

    <p class="summary" id="summary"></p>
    <p class="banner" id="banner" hidden></p>

    <div class="groups" id="groups"></div>

    <details id="rules"></details>

    <p class="foot" id="foot"></p>
  </aside>

  <main class="mapwrap">
    <div id="map" role="application"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script id="geo" type="application/json">__GEO__</script>
<script id="city" type="application/json">__CITY__</script>
<script>
(() => {
const GEO = JSON.parse(document.getElementById('geo').textContent);
const CITY = JSON.parse(document.getElementById('city').textContent);

// ---------- language ----------
// Order: #uk / #en in the URL, then the viewer's saved choice, then the browser language.
const LANGS = ['uk', 'en'];
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* storage may be blocked */ } },
};
const fromHash = () => LANGS.find(l => location.hash === '#' + l);
let LANG = fromHash() || (LANGS.includes(store.get('lang')) ? store.get('lang') : null)
  || (/^(uk|ru)\b/i.test(navigator.language || '') ? 'uk' : 'en');

// Bilingual value: B('текст', 'text'). tx() resolves it for the current language; plain strings pass through.
const B = (uk, en) => ({uk, en});
const tx = v => (v && typeof v === 'object' && 'uk' in v) ? v[LANG] : v;

const MONTHS = {
  uk: ['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'],
  en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
};
const fmt = md => { const [m, d] = md.split('-').map(Number); return LANG === 'uk' ? `${d} ${MONTHS.uk[m - 1]}` : `${MONTHS.en[m - 1]} ${d}`; };
const fmtFull = iso => { const [y, m, d] = iso.split('-').map(Number); return LANG === 'uk' ? `${d} ${MONTHS.uk[m - 1]} ${y}` : `${MONTHS.en[m - 1]} ${d}, ${y}`; };

const I18N = {
  uk: {
    title: 'Лосось Metro Vancouver',
    eyebrow: 'B.C. · Lower Mainland · прісні та солоні води',
    h1: 'Де ловити лосося',
    lede: 'Оберіть вид і дату. Лінії на карті — річки й озера Регіону 2, заливка — морські підзони Area 28 і 29. Натисніть будь-де на карті, щоб побачити найближчу вулицю й прокласти маршрут.',
    spLabel: 'Вид лосося', dateLabel: 'Дата риболовлі', today: 'Сьогодні', mapLabel: 'Карта водойм Lower Mainland',
    legendTitle: 'Легенда', legendHint: 'Лінії — річки, заливка — морські підзони',
    legendBoth: 'Чавича + кижуч (Chinook + Coho)', legendChinook: 'Лише чавича (Chinook)', legendCoho: 'Лише кижуч (Coho)',
    legendKeep: sp => `${sp}: можна взяти`, legendRelease: 'Лише відпустити', legendClosed: 'Закрито на дату', legendFraser: 'Закриття (Fraser)',
    summary: (acc, fo, ft, to, tt, d, rel) => `${acc} можна взяти у <b>${fo}</b> з ${ft} прісних водойм і в <b>${to}</b> з ${tt} морських підзон на ${d}.` + (rel ? ` Ще в <b>${rel}</b> — лише відпустити.` : ''),
    banner: (sp, d, rel) => `На ${d} немає водойм, де вид «${sp}» можна залишити. ` + (rel ? `Ловити й відпускати можна в ${rel} місцях.` : 'Прісні води Регіону 2 мають відкриття лише для чавичі (Chinook) і кижуча (Coho).'),
    canKeep: 'Можна взяти: ', releaseSuffix: ' — відпустити', releaseShort: 'відпустити',
    releaseOnly: 'Лише відпустити (без утримання)', closedOnDate: 'Закрито на цю дату',
    closureOn: range => ` (${range})`, closureOff: range => `Закриття діє ${range}; зараз тут діють правила підзони 29-3`,
    now: 'зараз', yearRound: 'увесь рік',
    subarea: s => `Підзона ${s}`, partOf293: 'частина підзони 29-3', mouthShort: 'Гирло Fraser',
    asOf: d => `Статус DFO на ${d}. «Зараз» означає, що DFO не вказує дату завершення.`,
    boldNote: d => `Жирним — правила, що діють ${d}.`,
    nearest: (n, dist) => `Найближча дорога: <b>${n}</b> (~${dist})`, m: 'м', km: 'км',
    routeGoogle: 'Маршрут у Google Maps ↗', openOsm: 'Відкрити в OpenStreetMap ↗',
    slipway: 'Спуск для човнів', fishingSpot: 'Місце для риболовлі (OSM)',
    rules: `<summary>Загальні правила</summary>
      <h3>Усюди</h3><ul>
        <li>Денний ліміт усіх видів лосося з припливних і прісних вод разом — 4. Ліміти для окремих видів теж діють.</li>
        <li>Ліміт володіння — подвійний денний.</li>
        <li>«Заводська» риба (hatchery marked) — чавича (Chinook) або кижуч (Coho) із загоєним шрамом на місці жирового плавця. Дику рибу з таким лімітом треба відпустити.</li>
        <li>Назви видів: чавича — Chinook, кижуч — Coho, кета — Chum, горбуша — Pink, нерка — Sockeye.</li></ul>
      <h3>Прісні води Регіону 2</h3><ul>
        <li>Лосося ловлять лише в світлу пору доби.</li>
        <li>Риболовлю заборонено ближче 100 м до державних споруд для підрахунку, пропуску або вирощування риби.</li>
        <li>Річний ліміт чавичі (Chinook) понад 50 см з усіх прісних вод — 10 риб.</li>
        <li>Басейн Squamish (Squamish, Cheakamus, Mamquam, Ashlu): разом не більше 1 заводського кижуча (Coho) на день.</li>
        <li>Мінімальний розмір: кижуч (Coho) — 25 см; чавича (Chinook), кета (Chum), горбуша (Pink), нерка (Sockeye) — 30 см. Довжину міряють від кінчика носа до розвилки хвоста.</li>
        <li>«Доросла чавича» (adult Chinook) — понад 50 см. Понад 62 см — на Fraser і Chehalis з 1 вересня до 31 грудня, а також на Chilliwack/Vedder (з Sumas) і Capilano.</li></ul>
      <h3>Солона вода: Area 28 і 29</h3><ul>
        <li>Потрібна BC Tidal Waters Sport Fishing Licence. Щоб залишити лосося, на ліцензії має бути Salmon Conservation Stamp.</li>
        <li>Кожну залишену чавичу (Chinook) одразу запишіть у ліцензію, у NRLS або в застосунок FishingBC.</li>
        <li>Річний ліміт чавичі (Chinook) з усіх припливних вод — 10.</li>

const DISTRICT_LABELS = [

// ---------- rule logic ----------
const isActive = (r, md) => r.from <= r.to ? (md >= r.from && md <= r.to) : (md >= r.from || md <= r.to);
const isYear = r => r.from === '04-01' && r.to === '03-31';
const fmtRange = (r, asOf) => isYear(r) ? t(asOf ? 'now' : 'yearRound') : `${fmt(r.from)} – ${fmt(r.to)}`;
const RETAIN = new Set(['both', ...SP_IDS]);

function speciesStatus(w, sp, md) {
  if (w.rules.some(r => r.sp === 'all' && r.type === 'closed' && !r.sec && isActive(r, md))) return {st:'closed'};
  const act = w.rules.filter(r => r.sp === sp && isActive(r, md));
  const ret = act.find(r => r.type === 'retain');
  if (ret) return {st:'retain', rule:ret};
  const rel = act.find(r => r.type === 'release');
  if (rel) return {st:'release', rule:rel};
  return {st:'closed'};
}

function closedText(w, md) {
  const c = w.rules.find(r => r.type === 'closed' && !r.sec && isActive(r, md));
  return c ? lim(c.lim) : t('closedOnDate');
}

// Returns {cat, text}: cat drives color; text is the short line for the list.
function evaluate(w, sel, md) {
  if (w.closure) {
    const r = w.rules[0];
    return isActive(r, md)
      ? {cat:'fraser', text: lim(r.lim) + (isYear(r) ? '' : t('closureOn', fmtRange(r)))}
      : {cat:'inactive', text: t('closureOff', fmtRange(r))};
  }
  if (sel === 'all') {
    const st = Object.fromEntries(SP_IDS.map(s => [s, speciesStatus(w, s, md)]));
    const ret = SP_IDS.filter(s => st[s].st === 'retain');
    const rel = SP_IDS.filter(s => st[s].st === 'release');
    const cat = st.chinook.st === 'retain' && st.coho.st === 'retain' ? 'both'
      : st.chinook.st === 'retain' ? 'chinook' : st.coho.st === 'retain' ? 'coho'
      : ret.length ? ret[0] : rel.length ? 'release' : 'closed';
    let text;
    if (!ret.length && !rel.length) text = closedText(w, md);
    else if (ret.length <= 2) text = [...ret.map(s => `${spName(s)}: ${lim(st[s].rule.lim)}`), ...rel.map(s => `${spName(s)}: ${t('releaseShort')}`)].join(' · ');
    else text = t('canKeep') + ret.map(spLow).join(', ') + (rel.length ? ` · ${rel.map(spLow).join(', ')}${t('releaseSuffix')}` : '');
    return {cat, text};
  }
  const s = speciesStatus(w, sel, md);
  if (s.st === 'retain') return {cat: sel, text: lim(s.rule.lim)};
  if (s.st === 'release') return {cat:'release', text: t('releaseOnly')};
  return {cat:'closed', text: closedText(w, md)};
}

// ---------- theme-aware colors ----------
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const CAT_VAR = {chinook:'--c-chinook', coho:'--c-coho', both:'--c-both', chum:'--c-chum', pink:'--c-pink', sockeye:'--c-sockeye',

[['base', 350], ['roads', 360], ['tidal', 380], ['water', 410], ['poi', 420]].forEach(([n, z]) => { map.createPane(n).style.zIndex = z; });
const R_BASE = L.svg({pane:'base', padding:.5});
const R_ROADS = L.canvas({pane:'roads', padding:.3});

// ---------- roads (decoded from delta-encoded integer coordinates, 1e-5 degrees) ----------
const ROAD_CLASSES = ['motorway','trunk','primary','secondary','tertiary','minor'];
const ROAD_MINZ = {motorway:7.5, trunk:7.5, primary:9, secondary:10.5, tertiary:12, minor:13};
const roadIndex = [];                                    // {name, pts:[[lat,lng]...], bb:[s,w,n,e]}
const roadLines = Object.fromEntries(ROAD_CLASSES.map(c => [c, []]));
for (const [ci, ni, flat] of CITY.roads) {
  let x = 0, y = 0; const pts = [];
  let s = 90, w = 180, n = -90, e = -180;
  for (let i = 0; i < flat.length; i += 2) {
    x += flat[i]; y += flat[i + 1];
    const lng = x / 1e5, lat = y / 1e5;
    pts.push([lat, lng]);
    if (lat < s) s = lat; if (lat > n) n = lat; if (lng < w) w = lng; if (lng > e) e = lng;
  }
  roadIndex.push({name: ni >= 0 ? CITY.names[ni] : null, pts, bb:[s, w, n, e]});
  roadLines[ROAD_CLASSES[ci]].push(pts);
}
const roadLayers = {};
for (const cls of ROAD_CLASSES) {
  const opts = {renderer:R_ROADS, pane:'roads', interactive:false, lineCap:'round', lineJoin:'round', smoothFactor:1};
  roadLayers[cls] = {casing: cls === 'minor' ? null : L.polyline(roadLines[cls], opts), line: L.polyline(roadLines[cls], opts)};
}
const ROAD_W = {motorway:[5, 3.2], trunk:[4.5, 2.8], primary:[4, 2.4], secondary:[3.4, 2], tertiary:[2.8, 1.6], minor:[0, 1.2]};
function styleRoads() {
  for (const cls of ROAD_CLASSES) {
    const mw = cls === 'motorway' || cls === 'trunk';
    const {casing, line} = roadLayers[cls];
    if (casing) casing.setStyle({color: css(mw ? '--road-mw-case' : '--road-case'), weight: ROAD_W[cls][0], opacity:1});
    line.setStyle({color: css(mw ? '--road-mw' : cls === 'minor' ? '--road-minor' : '--road'), weight: ROAD_W[cls][1], opacity:1});
  }
}
// Draw order: every casing first, then lines from minor to motorway, so major roads sit on top.
let tilesOn = false;
function syncRoads() {
  const z = map.getZoom();
  const order = [...ROAD_CLASSES].reverse();
  for (const cls of order) {
    const want = !tilesOn && z >= ROAD_MINZ[cls];
    const {casing, line} = roadLayers[cls];
    for (const l of [casing, line]) if (l) { if (want && !map.hasLayer(l)) l.addTo(map); if (!want && map.hasLayer(l)) map.removeLayer(l); }
  }
  for (const cls of order) { const l = roadLayers[cls].line; if (map.hasLayer(l)) l.bringToFront(); }
  for (const cls of order) { const c = roadLayers[cls].casing; if (c && map.hasLayer(c)) c.bringToBack(); }
}

// ---------- labels: places, parks, districts, subareas ----------
const PLACE_RANK = {city:8, town:9, village:11, suburb:11, hamlet:12, neighbourhood:13};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label = (lat, lng, html) => L.marker([lat, lng], {interactive:false, keyboard:false, pane:'markerPane',

DISTRICT_LABELS.forEach(([n, lng, lat, cls]) => label(lat, lng, `<span class="lbl district m8 ${cls || ''}">${n}</span>`));
Object.entries(GEO.subpts).forEach(([lab, [lng, lat]]) => label(lat, lng, `<span class="lbl sublbl m10">${lab}</span>`));

// ---------- points of interest: boat launches and fishing spots ----------

// ---------- fishing waters ----------
const layers = {};
WATERS.forEach(w => {
  if (w.tidal) {
    const fc = w.geom === 'mouth'
      ? {type:'Feature', properties:{label:'29-3'}, geometry:GEO.mouth}
      : {type:'FeatureCollection', features: w.subs.map(s => ({type:'Feature', properties:{label:s}, geometry:GEO.subs[s]}))};
    const poly = L.geoJSON(fc, {renderer:R_TIDAL, pane:'tidal', onEachFeature:(f, l) => {
      l.bindTooltip(() => esc(`${w.geom === 'mouth' ? t('mouthShort') : f.properties.label} · ${tx(w.name)}`), {sticky:true, direction:'top', offset:[0, -8]});
      l.on('click', e => { skipMapClick = Date.now(); openPopup(w, e.latlng, f.properties.label); });
    }}).addTo(map);
    layers[w.id] = {poly};
    return;
  }
  const g = GEO.waters[w.id];
  const halo = L.geoJSON(g, {renderer:R_WATER, pane:'water', interactive:false}).addTo(map);
  const line = L.geoJSON(g, {renderer:R_WATER, pane:'water', interactive:false}).addTo(map);
  const hit = L.geoJSON(g, {renderer:R_WATER, pane:'water', style:{weight:18, opacity:0, fillOpacity:w.lake ? .01 : 0}}).addTo(map);
  hit.bindTooltip(() => esc(tx(w.name)), {sticky:true, direction:'top', offset:[0, -8]});
  hit.on('click', e => { skipMapClick = Date.now(); openPopup(w, e.latlng); });
  layers[w.id] = {halo, line, hit};
});
layers['a29-mouth'].poly.bringToFront();

function styleWater(w, cat) {
  const L_ = layers[w.id];
  const color = catColor(cat);
  const closed = cat === 'closed' || cat === 'inactive';
  if (w.tidal) {
    L_.poly.setStyle({
      color, weight: cat === 'fraser' ? 2 : 1.2, opacity: cat === 'inactive' ? .55 : .9,
      dashArray: (cat === 'fraser' || cat === 'release' || closed) ? '5 4' : null,
      fillColor: color, fillOpacity: cat === 'inactive' ? 0 : cat === 'fraser' ? .32 : closed ? .08 : cat === 'release' ? .15 : .22,
    });
    return;
  }
  const fr = cat === 'fraser';
  const weight = fr ? 3.5 : closed ? 2.5 : 5;
  L_.halo.setStyle({color:css('--halo'), weight: weight + 3, opacity: closed ? .5 : .9, fill:false, lineCap:'round', lineJoin:'round'});
  L_.line.setStyle({
    color, weight, opacity:1, lineCap: fr ? 'butt' : 'round', lineJoin:'round',
    dashArray: fr ? '8 6' : cat === 'release' ? '7 6' : null,
    fillColor: color, fillOpacity: w.lake ? (closed ? .25 : .6) : 0,
  });
  if (!closed) L_.line.bringToFront();
}

// ---------- nearest street + route link ----------
function nearestRoad(ll) {
  for (const pad of [.012, .06]) { const r = nearestRoadWithin(ll, pad); if (r) return r; }
  return null;
}
function nearestRoadWithin(ll, pad) {
  const k = Math.cos(ll.lat * Math.PI / 180);
  let best = null, bd = Infinity;
  for (const r of roadIndex) {
    if (!r.name) continue;
    const [s, w, n, e] = r.bb;
    if (ll.lat < s - pad || ll.lat > n + pad || ll.lng < w - pad / k || ll.lng > e + pad / k) continue;
    for (let i = 1; i < r.pts.length; i++) {
      const ax = r.pts[i - 1][1] * k, ay = r.pts[i - 1][0], bx = r.pts[i][1] * k, by = r.pts[i][0];
      const px = ll.lng * k, py = ll.lat, dx = bx - ax, dy = by - ay;
      const q = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1)));
      const d = (ax + q * dx - px) ** 2 + (ay + q * dy - py) ** 2;
      if (d < bd) { bd = d; best = r; }
    }
  }
  return best ? {name: best.name, m: Math.sqrt(bd) * 111320} : null;
}
function routeBlock(ll) {
  const lat = ll.lat.toFixed(5), lng = ll.lng.toFixed(5);
  const r = nearestRoad(ll);
  const dist = r && (r.m < 1000 ? `${Math.round(r.m / 10) * 10} ${t('m')}` : `${(r.m / 1000).toFixed(1)} ${t('km')}`);
  const street = r ? `<span class="street">${t('nearest', esc(r.name), dist)}</span>` : '';
  return `<div class="route">${street}<span class="ll">${lat}, ${lng}</span>
    <a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank" rel="noopener">${t('routeGoogle')}</a>
    <a href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=16/${lat}/${lng}" target="_blank" rel="noopener">${t('openOsm')}</a></div>`;
}
// Popup size follows the map size, so on a phone it scrolls inside instead of covering the whole map.
const popupOpts = w => { const {x, y} = map.getSize();
  return {maxWidth: Math.min(w, x - 56), maxHeight: Math.max(160, Math.round(y * .6)), autoPanPaddingTopLeft:[48, 16], autoPanPaddingBottomRight:[16, 16]}; };
let reopen = null, activePopup = null;                // re-renders the open popup after a language switch
function openPointPopup(ll, title) {
  reopen = () => openPointPopup(ll, title);
  activePopup = L.popup(popupOpts(320)).setLatLng(ll)
    .setContent(`<div class="pop">${title ? `<h3>${esc(title)}</h3>` : ''}${routeBlock(ll)}</div>`).openOn(map);
}
map.on('click', e => { if (Date.now() - skipMapClick > 80) openPointPopup(e.latlng, ''); });

// ---------- popup ----------
const RULE_CAT = r => r.type === 'retain' ? r.sp : r.type === 'release' ? 'release' : r.type === 'closed' ? 'fraser' : null;

function rulesTable(rules, md, asOf) {
  const rows = rules.map(r => {
    const now = isActive(r, md);
    const cat = RULE_CAT(r);
    const fn = r.fn ? ` <a href="${FN[r.fn]}" target="_blank" rel="noopener">${r.fn}</a>` : '';
    return `<tr class="${now ? 'now' : ''}" style="--c:${now && cat ? catColor(cat) : 'transparent'}">
      <td class="sp">${esc(spName(r.sp))}</td><td class="d">${fmtRange(r, asOf)}</td><td>${esc(lim(r.lim))}${fn}</td></tr>`;
  }).join('');
  return `<table>${rows}</table>`;
}

function openPopup(w, latlng, sub) {
  reopen = () => openPopup(w, latlng, sub);
  const md = state.md;
  let body = '';
  if (w.secs) {
    for (const [k, lab] of Object.entries(w.secs)) body += `<div class="subh">${esc(tx(lab))}</div>` + rulesTable(w.rules.filter(r => r.sec === k), md);
    const common = w.rules.filter(r => !r.sec);
    if (common.length) body = rulesTable(common, md) + body;
  } else body = rulesTable(w.rules, md, w.asOf);
  const notes = [...(w.notes || []), ...((w.subNotes && sub && w.subNotes[sub]) || [])].map(n => `<p class="note">${esc(tx(n))}</p>`).join('');
  const tag = w.tidal ? `<span class="tag">${w.geom === 'mouth' ? t('partOf293') : esc(t('subarea', sub))}</span>` : '';
  const asOf = w.asOf ? `<p class="note">${esc(t('asOf', fmtFull(w.asOf)))}</p>` : '';
  const ll = latlng || anchorPoint(w);
  const html = `<div class="pop"><h3>${esc(tx(w.name))}</h3>${tag}
    ${w.sec ? `<p class="sec">${esc(tx(w.sec))}</p>` : ''}${body}${notes}${asOf}
    <p class="note">${esc(t('boldNote', fmt(md)))}</p>${routeBlock(ll)}</div>`;
  activePopup = L.popup(popupOpts(360)).setLatLng(ll).setContent(html).openOn(map);
}

// A point on the feature itself (not just the bounds centre, which can fall on dry land for a curved river).
function anchorPoint(w) {
  if (w.tidal) {
    if (w.geom === 'mouth') return layers[w.id].poly.getBounds().getCenter();
    const [lng, lat] = GEO.subpts[w.subs[0]]; return L.latLng(lat, lng);
  }
  const c = layers[w.id].line.getBounds().getCenter();
  let best = c, bd = Infinity;
  const walk = a => Array.isArray(a) ? a.forEach(walk) : (() => { const d = a.distanceTo(c); if (d < bd) { bd = d; best = a; } })();
  layers[w.id].line.eachLayer(l => walk(l.getLatLngs()));
  return best;
}

// ---------- controls ----------

    + `<div class="hint">${esc(t('legendHint'))}</div>`;
}

function render() {
  const {sp, md} = state;
  const res = WATERS.map(w => ({w, ...evaluate(w, sp, md)}));
  res.forEach(({w, cat}) => styleWater(w, cat));
  layers['a29-mouth'].poly.bringToFront();

  const fresh = res.filter(r => !r.w.tidal && !r.w.closure);
  const tidal = res.filter(r => r.w.tidal && !r.w.closure);
  const nSubs = rs => rs.reduce((a, r) => a + r.w.subs.length, 0);
  const fo = fresh.filter(r => RETAIN.has(r.cat)).length;
  const to = nSubs(tidal.filter(r => RETAIN.has(r.cat)));
  const rel = fresh.filter(r => r.cat === 'release').length + nSubs(tidal.filter(r => r.cat === 'release'));
  $('summary').innerHTML = t('summary', SP_ACC[LANG][sp], fo, fresh.length, to, nSubs(tidal), fmt(md), rel);
  const none = fo + to === 0;
  $('banner').hidden = !none;
  if (none) $('banner').textContent = t('banner', spName(sp), fmt(md), rel);

  const ORDER = {both:0, chinook:0, coho:0, chum:0, pink:0, sockeye:0, release:1, inactive:2, closed:2, fraser:3};
  $('groups').innerHTML = Object.entries(DISTRICTS).map(([d, title]) => {
    const items = res.filter(r => r.w.d === d)
      .sort((a, b) => (ORDER[a.cat] - ORDER[b.cat]) || tx(a.w.name).localeCompare(tx(b.w.name)));
    return `<section class="group"><h2>${esc(tx(title))}</h2><ul>${items.map(({w, cat, text}) => {
      const off = cat === 'closed' || cat === 'inactive';
      return `<li><button type="button" class="item ${off ? 'is-off' : ''}" data-id="${w.id}">
        <span class="dot ${off ? 'off' : ''} ${w.tidal ? 'sq' : ''}" style="--c:var(${CAT_VAR[cat]})"></span>
        <span class="nm">${esc(tx(w.name))}${w.subsLabel ? ` <small>${esc(tx(w.subsLabel))}</small>` : ''}</span><span class="lim">${esc(text)}</span></button></li>`;
    }).join('')}</ul></section>`;
  }).join('');
  legend();
  map.closePopup();
}

function applyLang(lang, save) {
  LANG = lang;
  if (save) store.set('lang', lang);
  document.documentElement.lang = lang;
  document.title = t('title');
  $('t-eyebrow').textContent = t('eyebrow');
  $('t-h1').textContent = t('h1');
  $('t-lede').textContent = t('lede');
  $('sp-label').textContent = t('spLabel');
  $('date-label').textContent = t('dateLabel');
  $('today').textContent = t('today');
  $('map').setAttribute('aria-label', t('mapLabel'));
  const open = $('rules').open;
  $('rules').innerHTML = t('rules');
  $('rules').open = open;
  $('foot').innerHTML = t('foot');
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  const wasOpen = activePopup && map.hasLayer(activePopup) && reopen;
  renderSpecies();
  render();
  if (wasOpen) wasOpen();
}

$('species').addEventListener('change', e => { state.sp = e.target.value; render(); });
$('date').addEventListener('change', e => { if (e.target.value) { state.md = e.target.value.slice(5); render(); } });
$('today').addEventListener('click', () => { $('date').value = todayISO(); state.md = $('date').value.slice(5); render(); });
document.querySelector('.lang').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  applyLang(b.dataset.lang, true);
  if (fromHash() && fromHash() !== LANG) location.hash = LANG;   // a stale #uk/#en would win on reload
});
window.addEventListener('hashchange', () => { const l = fromHash(); if (l && l !== LANG) applyLang(l, true); });
$('groups').addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b) return;
  const w = WATERS.find(x => x.id === b.dataset.id);
  const L_ = layers[w.id];
  const bounds = (L_.poly || L_.line).getBounds();
  map.flyToBounds(bounds, {padding:[60, 60], maxZoom:13, duration:.6});
  // flyToBounds may not emit 'moveend' when the view does not change, so a timer is the fallback.
  let shown = false;
  // map.stop() ends a still-running flight: Leaflet skips popup auto-pan while the map animates.
  const show = () => { if (!shown) { shown = true; map.stop(); openPopup(w, null, w.subs && w.subs[0]); } };
  map.once('moveend', show);
  setTimeout(show, 900);
  if (window.matchMedia('(max-width:760px)').matches) $('map').scrollIntoView({behavior:'smooth', block:'start'});
});

// ---------- basemap: real tiles when the host allows them, built-in vector map otherwise ----------
// The claude.ai artifact sandbox blocks external images, so tiles fail there and the vector layers stay.
// On a normal web host (GitHub Pages), OpenStreetMap standard tiles load and replace the vector base.
// OSM tile policy: visible attribution (already in the attribution control) and a valid Referer (browser default).
// Dark theme: OSM has no dark style, so CSS inverts the tile pane (see .tiles-on rules).
const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19});
tiles.once('tileload', () => {
  tilesOn = true;
  map.getContainer().classList.add('tiles-on');
  map.getPane('base').style.display = 'none';
  syncRoads();
});
tiles.on('tileerror', () => { if (!tilesOn && map.hasLayer(tiles)) map.removeLayer(tiles); });
tiles.addTo(map);

function styleBase() {
  base.land.setStyle({stroke:true, color:css('--land-edge'), weight:.6, fillColor:css('--land'), fillOpacity:1});
  base.us.setStyle({stroke:true, color:css('--land-edge'), weight:.6, fillColor:css('--us'), fillOpacity:1});
  base.lakes.setStyle({stroke:true, color:css('--river'), weight:.6, fillColor:css('--lake'), fillOpacity:1});
  base.fraser.setStyle({color:css('--river'), weight:4, opacity:1, lineCap:'round'});
  styleRoads();
  stylePoi();
}

// Repaint map colors when the viewer switches theme.
const repaint = () => { styleBase(); render(); };
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', repaint);
new MutationObserver(repaint).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

map.on('zoomend', () => { syncZoomClasses(); syncRoads(); syncPoi(); });

$('date').value = todayISO();
state.md = $('date').value.slice(5);
styleBase();
applyLang(LANG, false);
const all = L.featureGroup(WATERS.filter(w => !w.tidal && !w.closure).map(w => layers[w.id].line));
map.fitBounds(all.getBounds(), {padding:[20, 20]});
syncZoomClasses(); syncRoads(); syncPoi();
new ResizeObserver(() => map.invalidateSize()).observe($('map'));
const narrow = window.matchMedia('(max-width:760px)');
$('legend').open = !narrow.matches;
map.on('popupopen', () => { if (narrow.matches) $('legend').open = false; });
})();
</script>
