<title>Лосось Metro Vancouver</title>
<!-- The saved theme applies before the first paint; the main script runs only after Leaflet loads. -->
<script>try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch { /* storage may be blocked */ }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@500;600;700&family=Fira+Sans:wght@400;500;600&family=Fira+Mono:wght@400;500&display=swap">
<style>
/*__LEAFLET_CSS__*/
:root{
  --ink:#16272c; --ink-2:#4a5d62; --ink-3:#7b8b8f;
  --paper:#f4f6f3; --panel:#ffffff; --line:#d7dfdc; --focus:#0b5563;
  --sea:#c3d6dd; --land:#eceee6; --land-edge:#b9c4bf; --us:#e2e1da; --lake:#b2cdd6; --river:#8fb3c0;
  --label:#3b4c50; --halo:#ffffff;
  --c-chinook:#be5b03; --c-coho:#1781da; --c-both:#793d9c; --c-chum:#178560; --c-pink:#e03699; --c-sockeye:#9d0126;
  --c-release:#b58a00; --c-closed:#95a0a0; --c-fraser:#b42318; --c-water:#1f6390;
  --chip-bg:#eef2f0;
  --tile-filter:none;
  --f-display:"Fira Sans Extra Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Fira Sans","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"Fira Mono",Consolas,"DejaVu Sans Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#e3ecea; --ink-2:#a9b9b7; --ink-3:#7c8c8b;
    --paper:#0e1719; --panel:#142124; --line:#26383b; --focus:#6cc3cf;
    --sea:#0c1d24; --land:#1b2927; --land-edge:#2f4340; --us:#172220; --lake:#12303a; --river:#2c5866;
    --label:#b7c6c4; --halo:#0e1719;
    --c-chinook:#d57403; --c-coho:#2782bb; --c-both:#a572f0; --c-chum:#33ab6c; --c-pink:#ed1baa; --c-sockeye:#d91638;
    --c-release:#e3c04b; --c-closed:#5e6b6b; --c-fraser:#f2786d; --c-water:#7cc0e6;
    --chip-bg:#1c2c2f;
    --tile-filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#e3ecea; --ink-2:#a9b9b7; --ink-3:#7c8c8b;
  --paper:#0e1719; --panel:#142124; --line:#26383b; --focus:#6cc3cf;
  --sea:#0c1d24; --land:#1b2927; --land-edge:#2f4340; --us:#172220; --lake:#12303a; --river:#2c5866;
  --label:#b7c6c4; --halo:#0e1719;
  --c-chinook:#d57403; --c-coho:#2782bb; --c-both:#a572f0; --c-chum:#33ab6c; --c-pink:#ed1baa; --c-sockeye:#d91638;
  --c-release:#e3c04b; --c-closed:#5e6b6b; --c-fraser:#f2786d; --c-water:#7cc0e6;
  --chip-bg:#1c2c2f;
  --tile-filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.6);
}
/* Mobile first. Phones (the default): a full-screen map with the panel as a bottom sheet over it.
   JS sets --sheet-vis, the visible sheet height; the sheet, the legend and the bottom map controls follow it.
   From 768px: the panel is a sidebar next to the map. --tap is the minimum size of a touch target. */
:root{--tap:44px;--sheet-vis:0px;--sheet-ease:transform .32s cubic-bezier(.2,.8,.2,1)}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
.mapwrap{position:fixed;inset:0;isolation:isolate;container-type:inline-size}   /* cqw: the search box fits the map width */
.panel{position:fixed;left:0;right:0;bottom:0;z-index:2;height:calc(100dvh - 44px - env(safe-area-inset-top));display:flex;flex-direction:column;
  background:var(--panel);border-radius:16px 16px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.2);padding-bottom:env(safe-area-inset-bottom);
  transform:translateY(calc(100% - var(--sheet-vis)));transition:var(--sheet-ease)}
.grip{flex:none;display:flex;align-items:center;justify-content:center;width:100%;height:28px;min-height:0;padding:0;border:0;border-radius:16px 16px 0 0;background:none;cursor:grab;touch-action:none}
.grip::before{content:'';width:40px;height:5px;border-radius:3px;background:var(--ink-3);opacity:.5}
/* Peek and half: the sheet does not scroll; a vertical drag anywhere on it moves the sheet. Full: the content scrolls. */
.panel-body{flex:1;min-height:0;overflow:hidden;overscroll-behavior:contain;touch-action:none;padding:4px 16px 24px;display:flex;flex-direction:column;gap:12px}
:root[data-sheet="full"] .panel-body{overflow-y:auto;touch-action:pan-y}
.sheet-drag .panel,.sheet-drag .legend,.sheet-drag .leaflet-bottom{transition:none}
.sheet-drag .panel{user-select:none}
.intro{display:contents}
.eyebrow,.lede,#run{order:1}          /* phone: the list stays in the half sheet; "running now" comes after it */
#rules,.status,.foot{order:2}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font:600 12px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0}
h1{font:700 24px/1.1 var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.005em}
.lede{color:var(--ink-2);margin:0;max-width:60ch}
.lede a,.foot a,.pop a,details a{color:var(--focus)}
.ctl{display:flex;flex-direction:column;gap:8px}
/* Phones: the species chips and the date value explain themselves, so the labels are for screen readers only. */
.ctl-label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;font:600 13px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
/* The chips wrap to more rows: a row that scrolls sideways hides chips and a mouse cannot scroll it. */
.species{position:relative;display:flex;flex-wrap:wrap;gap:8px}
.ctl-label.vis{position:static;width:auto;height:auto;overflow:visible;clip-path:none}
/* Licence switch: one segmented radio group. */
.seg{position:relative;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1;display:flex;align-items:center;justify-content:center;min-height:var(--tap);padding:0 8px;cursor:pointer;background:var(--panel);font-weight:500;text-align:center;user-select:none}
.seg label:not(:first-of-type){border-left:1px solid var(--line)}
.seg label:active{background:var(--chip-bg)}
.seg input:checked+label{background:var(--ink);color:var(--panel)}
.seg input:focus-visible+label{outline:2px solid var(--focus);outline-offset:-3px}
.species input{position:absolute;opacity:0;pointer-events:none}
.species label{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 14px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--panel);font-weight:500;user-select:none;white-space:nowrap}
.species label:active{background:var(--chip-bg)}
.species label small{color:var(--ink-3);font-size:11px;font-weight:400}
.species input:checked+label{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.species input:checked+label small{color:inherit;opacity:.7}
.species input:focus-visible+label{outline:2px solid var(--focus);outline-offset:2px}
.sp-hint{font-size:12.5px;color:var(--ink-3);margin:0}
.spcard{border:1px solid var(--line);border-radius:8px;padding:8px 12px 10px}
.spcard summary{font:600 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.sp-fig{margin:10px 0 0}
.sp-fig img{display:block;width:100%;aspect-ratio:2.6/1;object-fit:contain;background:#fff;border-radius:6px}
.sp-fig figcaption{font-size:12px;color:var(--ink-3);margin-top:3px}
.spcard ul{padding-left:18px;margin:10px 0 0;color:var(--ink-2);font-size:13px}
.spcard li{margin-bottom:4px}
.spcard li b{color:var(--ink);font-weight:600}
.spcard .note{font-size:12px;color:var(--ink-3);margin:8px 0 0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.dot.off{background:none;border:1.5px solid var(--c-closed)}
.dot.sq{border-radius:2px;opacity:.75}
.daterow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* 16px keeps iOS Safari from zooming the page when the field gets focus. */
input[type=date]{font:500 16px var(--f-mono);min-height:var(--tap);padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
button{font:500 13px var(--f-body);min-height:var(--tap);padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--chip-bg);color:var(--ink);cursor:pointer}
button:active{background:var(--line)}
@media (hover:hover){button:hover{border-color:var(--ink-3)}}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.summary{font:500 15px/1.35 var(--f-body);margin:0}
.summary b{font-family:var(--f-mono);font-weight:500}
.banner{border-left:3px solid var(--c-fraser);background:var(--chip-bg);padding:10px 12px;border-radius:0 6px 6px 0;color:var(--ink);margin:0}
.groups{display:flex;flex-direction:column;gap:16px}
.group h2{font:600 15px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.group ul{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:12px 1fr;gap:4px 10px;align-items:start;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:10px 6px;color:inherit}
.item:active{background:var(--chip-bg)}
@media (hover:hover){.item:hover{background:var(--chip-bg)}}
.item .dot{margin-top:5px}
.item .nm{font-weight:600}
.item .nm small{font:400 12px var(--f-mono);color:var(--ink-3);margin-left:6px}
.item .lim{grid-column:2;color:var(--ink-2);font-size:13px}
.item.is-off .nm{color:var(--ink-3);font-weight:500}
.item.is-off .lim{color:var(--ink-3)}
.run ul{margin-bottom:4px}
.run .item:hover{background:none}
.run h3{font:600 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:10px 0 2px}
.run a{color:var(--focus)}
.run .nm a{font-weight:600}
.run .nm small{font-family:var(--f-body)}
.run .nm small a{font-weight:400}
.run .wl{display:block;margin-top:2px}
.wlink{font:500 12px var(--f-body);padding:1px 8px;margin:3px 4px 0 0;border-radius:999px}
.spark{display:block;grid-column:2;margin-top:4px;max-width:100%}
.spark line{stroke:var(--line);stroke-width:1}
.spark path{fill:var(--c);opacity:.35}
.spark path.now{opacity:1}
.spark path.z{fill:var(--ink-3);opacity:.6}
/* Report pin: a speech bubble whose sharp corner (bottom left) sits on the water. iconAnchor [0, 24] = that corner. */
.rep-pin{box-sizing:border-box;display:flex;align-items:center;gap:3px;height:24px;padding:0 7px;border:1.5px solid var(--focus);border-radius:12px 12px 12px 2px;
  background:var(--panel);color:var(--focus);font:700 11px/1 var(--f-mono);white-space:nowrap;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.25)}
.rep-pin svg{width:12px;height:12px;flex:none}
.rep-pin::after{content:'';position:absolute;inset:-10px}  /* a finger-sized hit area around the small bubble */
.rep-pin.in-legend{display:inline-flex;position:static;flex:none;height:18px;padding:0 5px;cursor:inherit;box-shadow:none}
.rep-pin.in-legend::after{content:none}
.unsure-pin{box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:20px;height:20px;border:1.5px solid var(--ink-2);
  border-radius:50%;background:var(--panel);color:var(--ink);font:700 12px/1 var(--f-mono);cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.25)}
.unsure-pin::after{content:'';position:absolute;inset:-10px}  /* a finger-sized hit area */
.unsure-pin.in-legend{display:inline-flex;position:static;flex:none;width:18px;height:18px;cursor:inherit;box-shadow:none}
.unsure-pin.in-legend::after{content:none}
/* My spot: a map pin (a square with three round corners, turned so the sharp corner points down).
   Leaflet moves the icon element with transform, so the inner span turns. iconAnchor [11, 27] = the tip. */
.spot-pin span{position:absolute;inset:0;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--ink);border:2px solid var(--panel);box-shadow:0 1px 5px rgba(0,0,0,.35)}
.spot-pin span::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--panel)}
.spot-pin{cursor:pointer}
.spot-pin::after{content:'';position:absolute;inset:-10px}  /* a finger-sized hit area */
.spot-pin.in-legend{position:relative;display:inline-block;flex:none;width:12px;height:12px;margin-top:3px;cursor:inherit}
.spot-pin.in-legend::after{content:none}
.spot-pin.in-legend span{border-width:1.5px;box-shadow:none}
.spot-pin.in-legend span::after{inset:2px}
.spots .lim{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.spots-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.spots-in p{flex:1 1 100%;margin:0}
.spots-out{box-sizing:border-box;width:100%;margin-top:8px;font:12px var(--f-mono);padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.spots-note{color:var(--ink-3);font-size:12px;margin:8px 0 0}
/* The name field looks like the popup title. It leaves room for the close button, as .pop h3 does. */
.spot .spot-name{box-sizing:border-box;width:calc(100% - 16px);font:700 20px/1.1 var(--f-display);color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:2px 0 4px;margin:0 0 8px}
/* 16px keeps iOS Safari from zooming the page when the field gets focus. */
.spot .spot-note{box-sizing:border-box;display:block;width:100%;font:16px/1.4 var(--f-body);color:var(--ink);background:var(--chip-bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;resize:vertical}
.spot-save{align-self:flex-start;margin-top:4px}
.spot-del{display:block;margin-top:8px;background:none;color:var(--c-fraser)}
.spot-del[data-armed]{background:var(--c-fraser);border-color:var(--c-fraser);color:#fff}
/* My location: the control under the zoom buttons, the GPS dot with its accuracy circle, and a short map message. */
.locate a{display:flex;align-items:center;justify-content:center;color:var(--ink)}
.locate svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.locate a.on{color:var(--focus)}
.locate a.wait svg{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.me-dot{box-sizing:border-box;border-radius:50%;background:var(--focus);border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 1px 6px rgba(0,0,0,.35);cursor:pointer}
.me-dot::after{content:'';position:absolute;inset:-12px}  /* a finger-sized hit area */
.me-acc{fill:var(--focus);fill-opacity:.12;stroke:var(--focus);stroke-opacity:.5}
.map-msg{position:absolute;top:calc(56px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:600;width:max-content;max-width:calc(100% - 120px);
  margin:0;padding:8px 12px;border-radius:8px;background:var(--ink);color:var(--panel);font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.map-msg:empty{display:none}
.man{font-style:italic;color:var(--ink-3)}
/* Water level gauge: a round badge centred on the station position. */
.gauge-pin{box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:22px;height:22px;border:1.5px solid var(--c-water);
  border-radius:50%;background:var(--panel);color:var(--c-water);cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.25)}
.gauge-pin svg{width:13px;height:13px;flex:none}
.gauge-pin::after{content:'';position:absolute;inset:-10px}  /* a finger-sized hit area */
.gauge-pin.in-legend{display:inline-flex;position:static;flex:none;width:18px;height:18px;cursor:inherit;box-shadow:none}
.gauge-pin.in-legend::after{content:none}
.lv{display:block;margin-top:4px;max-width:100%}
.lv .ln{fill:none;stroke:var(--c-water);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.lv line{stroke:var(--line);stroke-width:1}
.lv circle{fill:var(--c-water)}
.lv-now{margin:0}
.lv-now b{font-family:var(--f-mono);font-weight:500}
.lv-sub{margin:2px 0 0;color:var(--ink-2);font-size:12.5px}
.pop .gauge-go,.run .gauge-go{display:inline-flex;align-items:center;margin-top:6px}
.cnt{font-family:var(--f-mono);letter-spacing:0}
/* The "show more" fold of the report list: plain text styling, not the section style of the rules <details>. */
.run details.more{border-top:0;padding-top:0}
.run details.more summary{font:600 13px var(--f-body);letter-spacing:0;text-transform:none;color:var(--focus);padding:6px 6px;min-height:var(--tap);display:flex;align-items:center}
.pop-reps{margin:4px 0 0;padding-left:18px}
.pop-reps li{margin-bottom:4px}
.run .lim .dot{display:inline-block;width:8px;height:8px;vertical-align:baseline}
.run-lede,.run-note{color:var(--ink-2);font-size:13px;margin:0 0 6px}
.run-note{color:var(--ink-3);font-size:12px;margin:6px 0 0}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font:600 15px var(--f-display);letter-spacing:.04em;text-transform:uppercase}
#rules h3{font:600 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 0}
#rules ul{padding-left:18px;margin:8px 0 0;color:var(--ink-2)}
#rules li{margin-bottom:6px}
/* Foldable blocks (fold() in the script) look like the rules summary. The heading inside keeps the outline for screen readers. */
.fold[open]>summary{margin-bottom:6px}
.fold>summary :is(h2,h3){display:inline;font:inherit;letter-spacing:inherit;color:inherit;margin:0;padding:0;border:0}
.fold .fold{border-top:0;padding-top:0;margin-top:10px}
.fold .fold>summary{font-size:13px;letter-spacing:.06em;color:var(--ink-3)}
.pop .fold{margin-top:10px;padding-top:8px}
.pop .fold>summary{font-size:13px}
.foot{font-size:12px;color:var(--ink-3);margin:0}
.status{font:12.5px/1.45 var(--f-body);color:var(--ink-2);margin:0;padding:10px 12px;background:var(--chip-bg);border-radius:6px}
.status b{font-weight:600;color:var(--ink)}
.dfo-chip{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:500;font:600 12px var(--f-mono);padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);box-shadow:0 1px 6px rgba(0,0,0,.12)}
.dfo-chip.warn{background:var(--c-fraser);border-color:var(--c-fraser);color:#fff}
#map{position:absolute;inset:0;background:var(--sea)}
.legend{position:absolute;left:8px;bottom:22px;z-index:500;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:12.5px;box-shadow:0 2px 10px rgba(0,0,0,.12);max-width:calc(100% - 24px);
  transform:translateY(calc(-1 * min(var(--sheet-vis), 60dvh)));transition:var(--sheet-ease)}
.legend[open]{padding-bottom:10px}
.legend summary{cursor:pointer;min-height:var(--tap);font:600 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:6px}
.legend summary::-webkit-details-marker{display:none}
.legend summary::before{content:'';width:0;height:0;border:5px solid transparent;border-left-color:currentColor;transition:transform .15s}
.legend[open] summary::before{transform:rotate(90deg) translateX(2px)}
.legend[open] summary{margin-bottom:2px}
#legend-body{display:flex;flex-direction:column}
/* 22px keeps a 4px space between the 18px icons when --tap is 32px. */
.legend .row{display:flex;align-items:center;gap:8px;min-height:max(22px,calc(var(--tap) - 14px));padding:0;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.legend .row[aria-pressed="false"]{opacity:.45}
.legend .row[aria-pressed="false"] .tx{text-decoration:line-through}
/* A switched-off legend row hides its paths; they stay in the DOM, so the draw order does not change. */
.leaflet-pane path.lg-off{display:none}
/* All swatches and icons sit in one 26px column, so all labels start at the same x. */
.legend .ic{flex:none;width:26px;display:flex;align-items:center;justify-content:center}
.legend .sw{width:26px;height:0;border-top:5px solid var(--c);flex:none;border-radius:3px}
.legend .sw.dash{border-top-style:dashed;border-top-width:3px}
.legend .sw.thin{border-top-width:2px}
.legend .sw.dot2{border-top-style:dotted;border-top-width:2px;opacity:.5}
.legend .sw.fill{height:12px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 28%,transparent);border-radius:2px}
.legend .hint{color:var(--ink-3);font-size:11.5px;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.leaflet-container{font-family:var(--f-body);background:var(--sea)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);box-shadow:0 4px 18px rgba(0,0,0,.25)}
.leaflet-popup-content{margin:14px 16px;min-width:240px;max-width:340px;font-size:13px;line-height:1.4}
.leaflet-container a.leaflet-popup-close-button{color:var(--ink-3)}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-bottom-color:var(--line)}
@media (hover:hover){.leaflet-bar a:hover{background:var(--chip-bg);color:var(--ink)}}
.leaflet-top{top:env(safe-area-inset-top)}
/* The bottom map controls and the legend ride on top of the sheet, up to 60dvh; a full sheet covers them. */
.leaflet-bottom{transform:translateY(calc(-1 * min(var(--sheet-vis), 60dvh)));transition:var(--sheet-ease)}
@media (pointer:coarse){
  .leaflet-touch .leaflet-bar a{width:var(--tap);height:var(--tap);line-height:var(--tap);font-size:22px}
  .leaflet-container a.leaflet-popup-close-button{width:var(--tap);height:var(--tap);font:22px/var(--tap) Tahoma,Verdana,sans-serif}
  .pop h3{padding-right:24px}
  .spot .spot-name{width:calc(100% - 28px)}
}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--ink-3)}
.leaflet-control-attribution a{color:var(--ink-2)}
.leaflet-tooltip{background:var(--panel);color:var(--ink);border-color:var(--line);font:600 13px var(--f-body)}
.lbl{white-space:nowrap;pointer-events:none;display:none}
.district{font:600 15px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);text-shadow:0 0 4px var(--halo),0 0 4px var(--halo);opacity:.85}
.district.us{letter-spacing:.3em}
.sublbl{font:500 11px/1 var(--f-mono);color:var(--ink-2);text-shadow:0 0 3px var(--halo),0 0 3px var(--halo)}
.zg8 .m8,.zg9 .m9,.zg10 .m10,.zg11 .m11,.zg12 .m12,.zg13 .m13,.zg14 .m14{display:block}
.tiles-on .leaflet-tile-pane{filter:var(--tile-filter)}
.pop h3{font:700 20px/1.05 var(--f-display);margin:0 0 2px}
.pop .tag{display:inline-block;font:500 11.5px var(--f-mono);background:var(--chip-bg);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin:2px 0 6px}
.pop .sec{color:var(--ink-2);margin:0 0 8px}
.pop table{border-collapse:collapse;width:100%;font-size:12.5px}
.pop td{padding:4px 6px 4px 0;vertical-align:top;border-top:1px solid var(--line)}
.pop td.d{font-family:var(--f-mono);white-space:nowrap;color:var(--ink-2);font-size:12px}
.pop tr.now td{font-weight:600;color:var(--ink)}
.pop tr.now td.d{color:var(--ink)}
.pop tr.now td:first-child{box-shadow:inset 3px 0 0 var(--c);padding-left:7px}
.pop .sp{font-weight:600;white-space:nowrap}
.pop-narrow .pop .sp{white-space:normal}   /* see popupOpts */
.pop .subh{font:600 12px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:10px 0 2px}
.pop .note{color:var(--ink-2);margin:8px 0 0;font-size:12.5px}
.route{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.route .ll{font:500 12px var(--f-mono);color:var(--ink-3);user-select:all}
.route a{font-weight:600}
/* Map search: a button under the zoom control opens a field; the results list opens under the field. */
.search-ctl{position:relative}
.search-ctl .leaflet-bar a{display:flex;align-items:center;justify-content:center;color:var(--ink)}
.search-ctl .leaflet-bar a[aria-expanded="true"]{color:var(--focus)}
.search-ctl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.search-box{position:absolute;top:0;left:calc(100% + 8px);width:min(360px,calc(100cqw - 76px));background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.18);overflow:hidden;font:13px/1.35 var(--f-body)}
/* 16px keeps iOS Safari from zooming the page when the field gets focus. */
.search-box input{box-sizing:border-box;width:100%;min-height:var(--tap);padding:0 12px;border:0;background:none;color:var(--ink);font:16px var(--f-body)}
.search-box input:focus-visible{outline-offset:-2px}
.search-res{list-style:none;margin:0;padding:0;max-height:min(50dvh,320px);overflow-y:auto;border-top:1px solid var(--line)}
.search-res:empty{display:none}
.search-res button{display:block;width:100%;min-height:var(--tap);padding:6px 12px;border:0;border-radius:0;background:none;text-align:left;font:inherit;color:inherit}
.search-res button:focus-visible{outline-offset:-2px}
@media (hover:hover){.search-res button:hover{background:var(--chip-bg)}}
.search-res b{display:block;font-weight:600}
.search-res small{display:block;color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-msg{margin:0;padding:8px 12px;border-top:1px solid var(--line);color:var(--ink-2);font-size:12.5px}
.search-msg:empty{display:none}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;border-radius:0;min-width:var(--tap);padding:0 9px;font:600 12px var(--f-mono);background:var(--panel);color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tools{display:flex;align-items:center;gap:4px;flex:none}
/* Theme switch: a quiet icon button. It shows the theme that a click turns on. */
.theme{display:inline-flex;align-items:center;justify-content:center;width:var(--tap);padding:0;border-color:transparent;background:none;color:var(--ink-3)}
@media (hover:hover){.theme:hover{border-color:transparent;color:var(--ink)}}
.theme svg{display:none;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.theme[data-next="dark"] .i-moon,.theme[data-next="light"] .i-sun{display:block}
/* A mouse or a trackpad does not need finger-sized targets. */
@media (min-width:768px) and (pointer:fine){:root{--tap:32px}}
/* Tablets and desktops: the panel is a sidebar next to the map. Keep 768px in sync with WIDE in the script. */
@media (min-width:768px){
  body{font-size:14px;line-height:1.45}
  .app{display:grid;grid-template-columns:minmax(320px,400px) 1fr;height:100%}
  .mapwrap{position:relative;inset:auto;min-height:0}
  .panel{position:static;height:auto;min-height:0;transform:none;transition:none;border-radius:0;box-shadow:none;border-right:1px solid var(--line);padding-bottom:0}
  .grip{display:none}
  .panel-body{overflow-y:auto;touch-action:auto;padding:20px 20px 28px;gap:18px}
  .intro{display:flex;flex-direction:column;gap:4px}
  .eyebrow,.lede,#run,#rules,.status,.foot{order:0}
  .lede{margin-top:4px}
  h1{font-size:34px;line-height:1.02}
  .ctl-label{position:static;width:auto;height:auto;overflow:visible;clip-path:none}
  .species{gap:6px}
  .species label{padding:0 10px}
  input[type=date]{font-size:14px}
  .spot .spot-note{font-size:13px}
  .legend,.leaflet-bottom{transform:none;transition:none}
  .legend{left:12px;bottom:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

        <details class="spcard" id="spcard" hidden><summary id="spcard-title"></summary><div id="spcard-body"></div></details>
      </div>

      <section class="group spots" id="spots" hidden></section>

      <section class="group run" id="run" hidden></section>

      <div class="groups" id="groups"></div>

      <details id="rules"></details>

      <p class="status" id="status-line"></p>
      <p class="foot" id="foot"></p>
    </div>
  </aside>

  <main class="mapwrap">
    <div id="map" role="application"></div>
    <button type="button" class="dfo-chip" id="dfo-chip"></button>
    <p class="map-msg" id="map-msg" role="status"></p>
    <details class="legend" id="legend"><summary id="legend-title"></summary><div id="legend-body"></div></details>
  </main>
</div>

// Order: #en / #fr / #uk in the URL, then the viewer's saved choice, then English.
const LANGS = ['en', 'fr', 'uk'];
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* storage may be blocked */ } },
  del: k => { try { localStorage.removeItem(k); } catch { /* storage may be blocked */ } },
};
const fromHash = () => LANGS.find(l => location.hash === '#' + l);
let LANG = fromHash() || (LANGS.includes(store.get('lang')) ? store.get('lang') : null) || 'en';

// Text in three languages: B('текст', 'text', 'texte'); French falls back to English (proper names).
// tx() resolves it for the current language; plain strings pass through.
const B = (uk, en, fr) => ({uk, en, fr: fr ?? en});

const fmt = md => { const [m, d] = md.split('-').map(Number);
  return LANG === 'en' ? `${MONTHS.en[m - 1]} ${d}` : `${LANG === 'fr' && d === 1 ? '1er' : d} ${MONTHS[LANG][m - 1]}`; };

// French short dates end with a period ("24 sept."): no second period at the end of a sentence.

    unsure: {"chapman-falls": "Ділянка закінчується за 100 м нижче водоспаду. DFO пише, що водоспад приблизно за 550 м вище ЛЕП, але на картах там водоспаду немає. Тому точку розраховано з тексту. Найближчий відомий водоспад — приблизно за 1,4 км вище ЛЕП. Дивіться знаки на місці.", "chapman-tidal": "Нижня межа — знаки припливних вод нижче мосту Hwy 101. Точне місце знаків невідоме, тому лінія йде до гирла.", "chehalis-bridge": "Межа — головний лісовозний міст «приблизно за 2,4 км нижче Chehalis Lake». Це єдиний міст тут, але в OSM він лише приблизно за 2 км від озера.", "coquitlam-dam": "DFO не вказує верхньої межі Coquitlam River. Лінія закінчується на дамбі Coquitlam, бо озеро і все вище — закритий вододіл питної води.", "sumas-signs": "Ділянка Sumas закінчується біля знаків межі поблизу Fraser. Місце знаків невідоме. За одним повідомленням рибалки, вони за 100–150 ярдів від Fraser. Лінія йде до Fraser.", "campbell-closure": "З 15 серпня по 30 вересня ловити лосося заборонено від знаків межі вниз до цього пішохідного мосту в кінці Stayte Road. Місце верхніх знаків невідоме, тому ця ділянка на мапі не позначена.", "stave-ruskin": "Канал Ruskin закритий «до переїзду біля човнового спуску». Мапа вважає цим переїздом трубу під дорогою тут. Це не підтверджено.", "serpentine-tidal": "Припливна межа Serpentine — залізничний міст BNSF, нижче кінця лінії в OSM. Між кінцем лінії і мостом ще прісна вода.", "squamish-tidal": "Припливна межа Squamish — лінія на захід від кінчика дамби Squamish (Windsurfer Spit). На мапі лінію не обрізано на цій межі, тому її нижня частина може бути вже тидальною водою."}, manualTag: 'додано вручну',
    runNote: g => `Дані DFO попередні (unverified). Звіт — думка його автора: згадка виду не означає, що цей вид можна залишити. Правила дивіться на карті. Оновлено ${g}.`,
    rules: `<summary>Загальні правила</summary>
      <h3>Усюди</h3><ul>
        <li>Денний ліміт усіх видів лосося з припливних і прісних вод разом — 4. Ліміти для окремих видів теж діють.</li>
        <li>Ліміт володіння — подвійний денний.</li>
        <li>«Заводська» риба (hatchery marked) — чавича (Chinook) або кижуч (Coho) із загоєним шрамом на місці жирового плавця. Дику рибу з таким лімітом треба відпустити.</li>
        <li>Назви видів: чавича — Chinook, кижуч — Coho, кета — Chum, горбуша — Pink, нерка — Sockeye.</li></ul>
      <h3>Прісні води Регіону 2</h3><ul>
        <li>Лосося ловлять лише в світлу пору доби.</li>
        <li>Риболовлю заборонено ближче 100 м до державних споруд для підрахунку, пропуску або вирощування риби.</li>
        <li>Річний ліміт чавичі (Chinook) понад 50 см з усіх прісних вод — 10 риб.</li>
        <li>Басейн Squamish (Squamish, Cheakamus, Mamquam, Ashlu): разом не більше 1 заводського кижуча (Coho) на день.</li>
        <li>Мінімальний розмір: кижуч (Coho) — 25 см; чавича (Chinook), кета (Chum), горбуша (Pink), нерка (Sockeye) — 30 см. Довжину міряють від кінчика носа до розвилки хвоста.</li>
        <li>«Доросла чавича» (adult Chinook) — понад 50 см. Понад 62 см — на Fraser і Chehalis з 1 вересня до 31 грудня, а також на Chilliwack/Vedder (з Sumas) і Capilano.</li></ul>
      <h3>Солона вода: Area 28 і 29</h3><ul>
        <li>Потрібна BC Tidal Waters Sport Fishing Licence. Щоб залишити лосося, на ліцензії має бути Salmon Conservation Stamp.</li>
        <li>Кожну залишену чавичу (Chinook) одразу запишіть у ліцензію, у NRLS або в застосунок FishingBC.</li>
        <li>Річний ліміт чавичі (Chinook) з усіх припливних вод — 10.</li>
        <li>Лише гачок без зазубрини, цілий рік. З 1 вересня до 31 березня — лише гачок з одним вістрям і відстанню від вістря до цівки не більше 22 мм.</li>
        <li>Мінімальний розмір: чавича (Chinook) — 62 см; кижуч (Coho), кета (Chum), горбуша (Pink), нерка (Sockeye) — 30 см.</li>
        <li>Статуси DFO для Area 28 і 29 не мають дати завершення, тому для будь-якої вибраної дати сторінка показує поточний стан. Виняток — сезонні закриття з датами, наприклад гирло Fraser.</li>
        <li>Правила на карті щодня автоматично оновлюються зі сторінок DFO. Якщо DFO змінить щось незвичне, оновлення зупиняється, і сторінка показує попередження.</li></ul>`,
    foot: `Джерела: <a href="https://www.pac.dfo-mpo.gc.ca/fm-gp/rec/fresh-douce/region2-eng.html" target="_blank" rel="noopener">DFO Region 2</a>, <a href="https://www.pac.dfo-mpo.gc.ca/fm-gp/rec/tidal-maree/a-s28-eng.html" target="_blank" rel="noopener">DFO Area 28</a>, <a href="https://www.pac.dfo-mpo.gc.ca/fm-gp/rec/tidal-maree/a-s29-eng.html" target="_blank" rel="noopener">DFO Area 29</a>, межі підзон — шар DFO PFMA Subareas 1:50 000, рівень води — <a href="https://wateroffice.ec.gc.ca/" target="_blank" rel="noopener">ECCC Water Office</a>. Межі ділянок на річках приблизні: точний опис є у вікні водойми. Правила змінюються через fishery notices, тому перевірте джерело перед виїздом. Картографічні дані © учасники OpenStreetMap (ODbL).`,

    unsure: {"chapman-falls": "The section ends 100 m below the falls, which DFO places about 550 m above the power line. No falls are mapped there, so this point is calculated from the text. The nearest mapped falls are about 1.4 km above the power line. Check the signs on site.", "chapman-tidal": "The lower limit is the tidal boundary signs below the Hwy 101 bridge. Their exact place is not known, so the line runs to the mouth.", "chehalis-bridge": "The limit is the main logging road bridge \"approximately 2.4 km downstream of Chehalis Lake\". This is the only bridge here, but in OSM it is only about 2 km below the lake.", "coquitlam-dam": "DFO gives no upper limit for the Coquitlam River. The line ends at the Coquitlam Dam, because the lake and everything above it is a closed drinking-water watershed.", "sumas-signs": "The Sumas section ends at fishing boundary signs near the Fraser. Their place is not known. One angler report puts them 100–150 yards above the Fraser. The line runs to the Fraser.", "campbell-closure": "From Aug 15 to Sep 30, salmon fishing is closed from the boundary signs down to this footbridge at the foot of Stayte Road. The place of the upper signs is not known, so the map does not show this stretch.", "stave-ruskin": "The Ruskin channel is closed \"downstream to the boat ramp crossing\". The map takes the culvert under the road here as that crossing. This is not confirmed.", "serpentine-tidal": "The Serpentine tidal boundary is the BNSF rail bridge, below the end of the OSM line. The water between the line end and the bridge is still fresh water.", "squamish-tidal": "The Squamish tidal boundary is a line due west from the tip of the Squamish dyke (Windsurfer Spit). The map line is not cut at it, so its lowest part may already be tidal water."}, manualTag: 'added by hand',
    runNote: g => `DFO data are preliminary (unverified). A report is its author's opinion: a species in a report does not mean you can retain it. Check the rules on the map. Updated ${g}.`,
    rules: `<summary>General rules</summary>
      <h3>Everywhere</h3><ul>
        <li>The daily limit for all Pacific salmon from tidal and fresh waters combined is 4. Individual species limits also apply.</li>
        <li>The possession limit is twice the daily limit.</li>
        <li>Hatchery marked salmon: Chinook or Coho with a healed scar in place of the adipose fin. Where a limit says hatchery marked, release wild fish.</li></ul>
      <h3>Region 2 fresh waters</h3><ul>
        <li>Salmon fishing is allowed in daylight hours only.</li>
        <li>No fishing within 100 m of any government facility for counting, passing or rearing fish.</li>
        <li>Annual limit: 10 Chinook over 50 cm from all fresh waters combined.</li>
        <li>Squamish watershed (Squamish, Cheakamus, Mamquam, Ashlu): aggregate daily limit of 1 hatchery marked Coho.</li>
        <li>Minimum size: Coho 25 cm; Chinook, Chum, Pink and Sockeye 30 cm. Measure from the tip of the nose to the tail fork.</li>
        <li>An adult Chinook is over 50 cm; over 62 cm on the Fraser and Chehalis from Sep 1 to Dec 31, and on the Chilliwack/Vedder (incl. Sumas) and Capilano.</li></ul>
      <h3>Tidal waters: Areas 28 and 29</h3><ul>
        <li>You need a BC Tidal Waters Sport Fishing Licence with a valid Salmon Conservation Stamp to retain salmon.</li>
        <li>Record every retained Chinook immediately on your licence, in NRLS or in the FishingBC app.</li>
        <li>Annual limit: 10 Chinook from all tidal waters.</li>
        <li>Barbless hooks year round. From Sep 1 to Mar 31, single-point hooks only, max. 22 mm from point to shank.</li>
        <li>Minimum size: Chinook 62 cm; Coho, Chum, Pink and Sockeye 30 cm.</li>
        <li>DFO statuses for Areas 28 and 29 have no end date, so for any selected date the page shows the current status. Dated seasonal closures, such as the Fraser mouth, follow the selected date.</li>
        <li>The map updates itself from the DFO pages every day. If DFO changes something unusual, the update stops and the page shows a warning.</li></ul>`,

  ['Sea-to-Sky',-123.55,50.0],['Sunshine Coast',-124.05,49.66],['North Shore',-123.04,49.42],
  ['Fraser Valley',-121.9,49.43],['Strait of Georgia',-123.72,49.2],['Howe Sound',-123.36,49.56],['USA',-122.25,48.975,'us'],
];

// ---------- rule logic ----------
const isActive = (r, md) => r.from <= r.to ? (md >= r.from && md <= r.to) : (md >= r.from || md <= r.to);
const isYear = r => r.from === '04-01' && r.to === '03-31';
const fmtRange = (r, asOf) => isYear(r) ? t(asOf ? 'now' : 'yearRound') : `${fmt(r.from)} – ${fmt(r.to)}`;
const RETAIN = new Set(['both', ...SP_IDS]);

function speciesStatus(w, sp, md) {
  if (w.rules.some(r => r.sp === 'all' && r.type === 'closed' && !r.sec && isActive(r, md))) return {st:'closed'};
  const act = w.rules.filter(r => r.sp === sp && isActive(r, md));
  const ret = act.find(r => r.type === 'retain');
  if (ret) return {st:'retain', rule:ret};
  const rel = act.find(r => r.type === 'release');
  if (rel) return {st:'release', rule:rel};
  return {st:'closed'};
}

function closedText(w, md) {
  const c = w.rules.find(r => r.type === 'closed' && !r.sec && isActive(r, md));
  return c ? lim(c.lim) : t('closedOnDate');
}

// Returns {cat, text}: cat drives color; text is the short line for the list.
function evaluate(w, sel, md) {
  if (w.closure) {
    const r = w.rules[0];
    return isActive(r, md)
      ? {cat:'fraser', text: lim(r.lim) + (isYear(r) ? '' : t('closureOn', fmtRange(r)))}
      : {cat:'inactive', text: t('closureOff', fmtRange(r))};
  }
  const full = !w.tidal && w.rules.find(r => r.sp === 'all' && r.type === 'closed' && !r.sec && isActive(r, md));
  if (full) return {cat:'fraser', text: lim(full.lim) + (isYear(full) ? '' : t('closureOn', fmtRange(full)))};
  if (sel === 'all') {
    const st = Object.fromEntries(SP_IDS.map(s => [s, speciesStatus(w, s, md)]));
    const ret = SP_IDS.filter(s => st[s].st === 'retain');
    const rel = SP_IDS.filter(s => st[s].st === 'release');
    const cat = st.chinook.st === 'retain' && st.coho.st === 'retain' ? 'both'
      : st.chinook.st === 'retain' ? 'chinook' : st.coho.st === 'retain' ? 'coho'
      : ret.length ? ret[0] : rel.length ? 'release' : 'closed';
    let text;
    if (!ret.length && !rel.length) text = closedText(w, md);
    else if (ret.length <= 2) text = [...ret.map(s => `${spName(s)}: ${lim(st[s].rule.lim)}`), ...rel.map(s => `${spName(s)}: ${t('releaseShort')}`)].join(' · ');
    else text = t('canKeep') + ret.map(spLow).join(', ') + (rel.length ? ` · ${rel.map(spLow).join(', ')}${t('releaseSuffix')}` : '');
    return {cat, text};
  }
  const s = speciesStatus(w, sel, md);
  if (s.st === 'retain') return {cat: sel, text: lim(s.rule.lim)};
  if (s.st === 'release') return {cat:'release', text: t('releaseOnly')};
  return {cat:'closed', text: closedText(w, md)};
}

// ---------- theme-aware colors ----------
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const CAT_VAR = {chinook:'--c-chinook', coho:'--c-coho', both:'--c-both', chum:'--c-chum', pink:'--c-pink', sockeye:'--c-sockeye',
                 release:'--c-release', closed:'--c-closed', inactive:'--c-closed', fraser:'--c-fraser', other:'--c-closed'};
const catColor = cat => css(CAT_VAR[cat]);

// ---------- map and panes ----------
const MAP_BOUNDS = L.latLngBounds([48.6, -125.3], [50.7, -120.8]);
const map = L.map('map', {
  zoomSnap: .25, minZoom: 7.5, maxZoom: 17, attributionControl: true,
  maxBounds: MAP_BOUNDS, maxBoundsViscosity: .8,
});
map.attributionControl.setPrefix(false);
// One attribution string: data credits, then the author link. applyLang replaces it, so the credit follows the language.
let attribution = '';
function renderAttribution() {
  map.attributionControl.removeAttribution(attribution);
  attribution = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · DFO · ECCC · '
    + `<a href="https://www.linkedin.com/in/vskotyk" target="_blank" rel="author noopener">${esc(t('credit'))}</a>`;
  map.attributionControl.addAttribution(attribution);
}
[['base', 350], ['tidal', 380], ['water', 410]].forEach(([n, z]) => { map.createPane(n).style.zIndex = z; });
const R_BASE = L.svg({pane:'base', padding:.5});
const R_TIDAL = L.svg({pane:'tidal', padding:.5});
const R_WATER = L.svg({pane:'water', padding:.5});

const base = {
  land: L.geoJSON(GEO.land, {renderer:R_BASE, pane:'base', interactive:false}).addTo(map),
  us:   L.geoJSON(GEO.us,   {renderer:R_BASE, pane:'base', interactive:false}).addTo(map),
  lakes:L.geoJSON({type:'FeatureCollection', features: GEO.lakes.map(g => ({type:'Feature', geometry:g}))}, {renderer:R_BASE, pane:'base', interactive:false}).addTo(map),
  fraser:L.geoJSON(GEO.fraser, {renderer:R_BASE, pane:'base', interactive:false}).addTo(map),
};

// ---------- labels: districts, subareas ----------
let tilesOn = false;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label = (lat, lng, html) => L.marker([lat, lng], {interactive:false, keyboard:false, pane:'markerPane',
  icon: L.divIcon({className:'', html, iconSize:null, iconAnchor:[0, 6]})}).addTo(map);
DISTRICT_LABELS.forEach(([n, lng, lat, cls]) => label(lat, lng, `<span class="lbl district m8 ${cls || ''}">${n}</span>`));
Object.entries(GEO.subpts).forEach(([lab, [lng, lat]]) => label(lat, lng, `<span class="lbl sublbl m10">${lab}</span>`));

function syncZoomClasses() {
  const z = map.getZoom(), el = map.getContainer();
  for (let k = 8; k <= 14; k++) el.classList.toggle('zg' + k, z >= k - .01);
}

// ---------- fishing waters ----------
let skipMapClick = 0;
const layers = {};
// A water with sections that have their own rules (rules.json "secs") draws each part (GEO.secs) in its own colour.
// GEO.secs names a part by the start of its DFO text. When DFO changes that text, the water shows as one line.
const partsOf = {};
const closedOf = {};                                   // no-fishing parts inside an open water (GEO.closed), always closed
function sectionParts(w) {
  const geo = GEO.secs && GEO.secs[w.id];
  if (!geo || !w.secs) return null;
  const key = en => Object.keys(w.secs).find(k => w.secs[k].en.toLowerCase().startsWith(en.toLowerCase()));
  const parts = geo.map(p => ({g: p.g, k: key(p.en), in: p.in && key(p.in)}));
  return parts.every((p, i) => p.k && (!geo[i].in || p.in)) ? parts : null;
}
// The rules of one part: its section's rows apply to the whole part; "in" adds the rows of the enclosing section.
const partWater = (w, p) => ({...w, rules: w.rules.filter(r => !r.sec || r.sec === p.k || r.sec === p.in)
  .map(r => r.sec === p.k ? {...r, sec: null} : r)});
WATERS.forEach(w => {
  if (w.tidal) {
    const fc = w.geom === 'mouth'
      ? {type:'Feature', properties:{label:'29-3'}, geometry:GEO.mouth}
      : {type:'FeatureCollection', features: w.subs.map(s => ({type:'Feature', properties:{label:s}, geometry:GEO.subs[s]}))};
    const poly = L.geoJSON(fc, {renderer:R_TIDAL, pane:'tidal', onEachFeature:(f, l) => {
      l.bindTooltip(() => esc(`${w.geom === 'mouth' ? t('mouthShort') : f.properties.label} · ${tx(w.name)}`), {sticky:true, direction:'top', offset:[0, -8]});
      l.on('click', e => { skipMapClick = Date.now(); openPopup(w, e.latlng, f.properties.label); });
    }}).addTo(map);
    layers[w.id] = {poly};
    return;
  }
  const g = GEO.waters[w.id];
  const halo = L.geoJSON(g, {renderer:R_WATER, pane:'water', interactive:false}).addTo(map);
  const line = L.geoJSON(g, {renderer:R_WATER, pane:'water', interactive:false}).addTo(map);
  const hit = L.geoJSON(g, {renderer:R_WATER, pane:'water', style:{weight:18, opacity:0, fillOpacity:w.lake ? .01 : 0}}).addTo(map);
  hit.bindTooltip(() => esc(tx(w.name)), {sticky:true, direction:'top', offset:[0, -8]});
  hit.on('click', e => { skipMapClick = Date.now(); openPopup(w, e.latlng); });
  layers[w.id] = {halo, line, hit};
  partsOf[w.id] = sectionParts(w);
  partsOf[w.id]?.forEach(p => {
    p.halo = L.geoJSON(p.g, {renderer:R_WATER, pane:'water', interactive:false}).addTo(map);
    p.line = L.geoJSON(p.g, {renderer:R_WATER, pane:'water', interactive:false}).addTo(map);
  });
  closedOf[w.id] = (GEO.closed && GEO.closed[w.id] || []).map(c => {
    const halo = L.geoJSON(c.g, {renderer:R_WATER, pane:'water', interactive:false}).addTo(map);
    const line = L.geoJSON(c.g, {renderer:R_WATER, pane:'water', interactive:false}).addTo(map);
    const hit = L.geoJSON(c.g, {renderer:R_WATER, pane:'water', style:{weight:18, opacity:0}}).addTo(map);
    hit.bindTooltip(() => esc(`${c.name} · ${t('noFishing')}`), {sticky:true, direction:'top', offset:[0, -8]});
    hit.on('click', e => { skipMapClick = Date.now(); openPopup(w, e.latlng); });
    return {halo, line, hit};
  });
});
layers['a29-mouth'].poly.bringToFront();

// 'other': the water needs the licence that the viewer does not have. It stays on the map as a faint outline.
const rowKey = cat => cat === 'inactive' ? 'closed' : cat;
function styleWater(w, cat) {
  const L_ = layers[w.id], parts = partsOf[w.id];
  closedOf[w.id]?.forEach(c => styleLine(w, c, c.cat = cat === 'other' ? cat : 'closed'));
  if (parts) {
    // The whole line stays for bounds and anchors; the parts show the colours and have their own legend rows.
    rowOf[w.id] = null;
    L_.halo.setStyle({opacity: 0, fill: false});
    L_.line.setStyle({opacity: 0, fill: false});
    parts.forEach((p, i) => {
      p.cat = cat === 'other' ? cat : evaluate(partWater(w, p), state.sp, state.md).cat;
      rowOf[`${w.id}#${i}`] = rowKey(p.cat);
      styleLine(w, p, p.cat);
    });
    return;
  }
  rowOf[w.id] = rowKey(cat);
  if (!w.tidal) return styleLine(w, L_, cat);
  const color = catColor(cat), closed = cat === 'closed' || cat === 'inactive';
  if (cat === 'other') {
    L_.poly.setStyle({color, weight: 1, opacity: .35, dashArray: '2 4', fillColor: color, fillOpacity: 0});
    return;
  }
  L_.poly.setStyle({
    color, weight: cat === 'fraser' ? 2 : 1.2, opacity: cat === 'inactive' ? .55 : .9,
    dashArray: (cat === 'fraser' || cat === 'release' || closed) ? '5 4' : null,
    fillColor: color, fillOpacity: cat === 'inactive' ? 0 : cat === 'fraser' ? .32 : closed ? .08 : cat === 'release' ? .15 : .22,
  });
}

// L_: {halo, line} of a fresh water or of one of its parts.
function styleLine(w, L_, cat) {
  const color = catColor(cat);
  if (cat === 'other') {
    L_.halo.setStyle({opacity: 0, fill: false});
    L_.line.setStyle({color, weight: 2, opacity: .35, dashArray: '2 4', fillColor: color, fillOpacity: w.lake ? .1 : 0,
                      lineCap: 'round', lineJoin: 'round'});
    return;
  }
  const closed = cat === 'closed' || cat === 'inactive';
  const fr = cat === 'fraser';
  const weight = fr ? 3.5 : closed ? 2.5 : 5;
  L_.halo.setStyle({color:css('--halo'), weight: weight + 3, opacity: closed ? .5 : .9, fill:false, lineCap:'round', lineJoin:'round'});
  L_.line.setStyle({
    color, weight, opacity:1, lineCap: fr ? 'butt' : 'round', lineJoin:'round',
    dashArray: fr ? '8 6' : cat === 'release' ? '7 6' : null,
    fillColor: color, fillOpacity: w.lake ? (closed ? .25 : .6) : 0,
  });
  if (!closed) L_.line.bringToFront();
}

// ---------- route link ----------
// save: {w} adds the "save to my spots" button; w is the water of the popup, if any (see the spot click handler).
function routeBlock(ll, save) {
  const lat = ll.lat.toFixed(5), lng = ll.lng.toFixed(5);
  return `<div class="route"><span class="ll">${lat}, ${lng}</span>
    <a href="https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}" target="_blank" rel="noopener">${t('routeGoogle')}</a>
    <a href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=16/${lat}/${lng}" target="_blank" rel="noopener">${t('openOsm')}</a>
    ${save && spots.length < SPOT_MAX ? `<button type="button" class="spot-save" data-lat="${lat}" data-lng="${lng}" data-w="${save.w ? esc(save.w.id) : ''}">${esc(t('spotSave'))}</button>` : ''}</div>`;
}
// Popup size follows the map size, so on a phone it scrolls inside instead of covering the whole map.
// On a phone a popup collapses the sheet to 'peek' (see 'popupopen'), so the peek height is kept clear.
// maxWidth is the content width. The popup adds 35 px (2×16 content margin, 2×1 wrapper padding, Leaflet's +1),
// and auto-pan keeps 48 + 16 px clear, so x - 99 is the widest content that fits between the paddings.
// When that is less than the requested width, 'pop-narrow' lets the species name wrap, so the rules table fits.
const popupOpts = w => { const {x, y} = map.getSize(), b = WIDE.matches ? 0 : sheet.peek, mw = Math.min(w, x - 99);
  return {maxWidth: mw, className: mw < w ? 'pop-narrow' : '', maxHeight: Math.max(160, Math.round((y - b) * .6)),
    autoPanPaddingTopLeft:[48, WIDE.matches ? 16 : 64], autoPanPaddingBottomRight:[16, 16 + b]}; };
let reopen = null, activePopup = null;                // re-renders the open popup after a language switch
function openPointPopup(ll, title) {
  reopen = () => openPointPopup(ll, title);
  activePopup = L.popup(popupOpts(320)).setLatLng(ll)
    .setContent(`<div class="pop">${title ? `<h3>${esc(title)}</h3>` : ''}${routeBlock(ll, {})}</div>`).openOn(map);
}
map.on('click', e => { if (Date.now() - skipMapClick > 80) openPointPopup(e.latlng, ''); });

// ---------- popup ----------
const RULE_CAT = r => r.type === 'retain' ? r.sp : r.type === 'release' ? 'release' : r.type === 'closed' ? 'fraser' : null;

function rulesTable(rules, md, asOf) {
  const rows = rules.map(r => {
    const now = isActive(r, md);
    const cat = RULE_CAT(r);
    const fn = (r.fn || []).map(f => ` <a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.id)}</a>`).join('');
    return `<tr class="${now ? 'now' : ''}" style="--c:${now && cat ? catColor(cat) : 'transparent'}">
      <td class="sp">${esc(spName(r.sp))}</td><td class="d">${fmtRange(r, asOf)}</td><td>${esc(lim(r.lim))}${fn}</td></tr>`;
  }).join('');
  return `<table>${rows}</table>`;
}

function openPopup(w, latlng, sub) {
  reopen = () => openPopup(w, latlng, sub);
  const md = state.md;
  let body = '';
  if (w.secs) {
    for (const [k, lab] of Object.entries(w.secs)) body += `<div class="subh">${esc(tx(lab))}</div>` + rulesTable(w.rules.filter(r => r.sec === k), md);
    const common = w.rules.filter(r => !r.sec);
    if (common.length) body = rulesTable(common, md) + body;
  } else body = rulesTable(w.rules, md, w.asOf);
  const notes = [...(w.notes || []), ...((w.subNotes && sub && w.subNotes[sub]) || [])].map(n => `<p class="note">${esc(tx(n))}</p>`).join('');
  const tag = w.tidal ? `<span class="tag">${w.geom === 'mouth' ? t('partOf293') : esc(t('subarea', sub))}</span>` : '';
  const asOf = w.asOf ? `<p class="note">${esc(t('asOf', fmtFull(w.asOf)))}</p>` : '';
  const ll = latlng || anchorPoint(w);
  const need = licensed(w) ? '' : `<p class="banner">${esc(t('needLicence', !!w.tidal))}</p>`;
  // Recent shop reports that name this water: under the rules, because the rules are what applies.
  const reps = reportsFor(w), repHtml = reps.length ? fold('pop-reps', esc(t('popReports')), '<ul class="pop-reps">'
    + reps.map(r => `<li>${extLink(r.url, `${esc(r.src)} · ${fmtIso(r.date)}`)}${manualTag(r)}${r.manual ? `: ${esc(r.title)}` : ''}`
      + (r.sp.length ? ` — ${esc(t('mentioned'))}${r.sp.map(sp => esc(spLow(sp))).join(', ')}` : '') + '</li>').join('')
    + `</ul><p class="note">${esc(t('popReportsNote'))}</p>`) : '';
  // Water level at the gauge of this water: under the rules, next to the reports.
  const g = gaugeFor(w), lvHtml = g ? fold('pop-lv', esc(t('lvTitle')), gaugeBlock(g, tx(w.name), true)
    + `<p class="note">${esc(t('lvNote'))}</p>`) : '';
  const html = `<div class="pop"><h3>${esc(tx(w.name))}</h3>${tag}${need}
    ${w.sec ? `<p class="sec">${esc(tx(w.sec))}</p>` : ''}${body}${notes}${lvHtml}${repHtml}${asOf}
    <p class="note">${esc(t('boldNote', fmt(md)))}</p>${routeBlock(ll, {w})}</div>`;
  // A node, not a string: activePopup.update() after a fold toggle then keeps the node and its fold state.
  const node = document.createElement('div');
  node.innerHTML = html;
  activePopup = L.popup(popupOpts(360)).setLatLng(ll).setContent(node.firstElementChild).openOn(map);
}

// A point on the feature itself (not just the bounds centre, which can fall on dry land for a curved river).
function anchorPoint(w) {
  if (w.tidal) {
    if (w.geom === 'mouth') return layers[w.id].poly.getBounds().getCenter();
    const [lng, lat] = GEO.subpts[w.subs[0]]; return L.latLng(lat, lng);
  }
  const c = layers[w.id].line.getBounds().getCenter();
  let best = c, bd = Infinity;
  const walk = a => Array.isArray(a) ? a.forEach(walk) : (() => { const d = a.distanceTo(c); if (d < bd) { bd = d; best = a; } })();
  layers[w.id].line.eachLayer(l => walk(l.getLatLngs()));
  return best;
}

// ---------- controls ----------
// lic: the viewer's licence. 'fresh' = BC Freshwater Fishing Licence, 'tidal' = BC Tidal Waters Sport Fishing Licence.
const LICENCES = ['all', 'fresh', 'tidal'];
const state = {sp:'all', md:'09-22', lic: LICENCES.includes(store.get('lic')) ? store.get('lic') : 'all'};
const licensed = w => state.lic === 'all' || (state.lic === 'tidal') === !!w.tidal;
const $ = id => document.getElementById(id);

function renderLicence() {
  $('lic-label').textContent = t('licLabel');
  $('lic-hint').textContent = t('licHint');
  $('licence').innerHTML = LICENCES.map(l => `<input type="radio" name="lic" id="lic-${l}" value="${l}" ${l === state.lic ? 'checked' : ''}>
    <label for="lic-${l}">${esc(t('lic')[l])}</label>`).join('');
}
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

function renderSpecies() {
  $('species').innerHTML = SPECIES.map(s => {
    const dot = `<span class="dot" style="--c:var(${s.id === 'all' ? '--c-both' : CAT_VAR[s.id]})"></span>`;

}

// Shows the identification card of the selected species; "All open" shows a hint instead.
function renderSpCard() {
  const sp = state.sp, card = $('spcard');
  $('sp-hint').hidden = sp !== 'all';

  card.hidden = sp === 'all';

  $('spcard-body').innerHTML = fig('ocean') + fig('spawn')
    + `<ul>${SPECIES_MARKS[sp].map(m => `<li>${tx(m)}</li>`).join('')}</ul>`

$('spcard').open = store.get('spcard') !== '0';
$('spcard').addEventListener('toggle', () => store.set('spcard', $('spcard').open ? '1' : '0'));

// A foldable block: open by default. The page remembers the blocks that the viewer folds, also across re-renders.
const folded = new Set((store.get('folded') || '').split(',').filter(Boolean));
const fold = (id, title, body) => `<details class="fold" data-fold="${id}"${folded.has(id) ? '' : ' open'}><summary>${title}</summary>${body}</details>`;
// 'toggle' does not bubble, so listen in the capture phase.
document.addEventListener('toggle', e => {
  const id = e.target.dataset && e.target.dataset.fold;
  if (!id) return;
  e.target.open ? folded.delete(id) : folded.add(id);
  store.set('folded', [...folded].join(','));
  if (e.target.closest('.leaflet-popup') && activePopup) activePopup.update();   // new height: re-check maxHeight and the position
}, true);

// Legend rows that the viewer switched off, for this visit only. A row key is a category, 'pins', 'unsure' or 'gauges'.
const hiddenRows = new Set();
const rowOf = {};                                      // water id -> the legend row of its current category (styleWater)
const eachPath = (l, fn) => l.eachLayer ? l.eachLayer(x => eachPath(x, fn)) : fn(l);
function applyHidden() {
  // Before the first setView, Leaflet has no paths yet. Nothing is hidden at that time, so a missing path is skipped.
  WATERS.forEach(w => { const off = hiddenRows.has(rowOf[w.id]);
    Object.values(layers[w.id]).forEach(g => eachPath(g, p => p.getElement()?.classList.toggle('lg-off', off)));
    [...partsOf[w.id] || [], ...closedOf[w.id] || []].forEach(p => { const pOff = hiddenRows.has(rowKey(p.cat));
      [p.halo, p.line, p.hit].forEach(g => g && eachPath(g, x => x.getElement()?.classList.toggle('lg-off', pOff))); }); });
  if (hiddenRows.has('pins')) pins.remove(); else pins.addTo(map);
  if (hiddenRows.has('unsure')) unsure.remove(); else unsure.addTo(map);
  if (hiddenRows.has('gauges')) gauges.remove(); else gauges.addTo(map);
  if (hiddenRows.has('spots')) spotLayer.remove(); else spotLayer.addTo(map);
}

function legend() {
  // "All open" colors a water by chum, pink or sockeye when it keeps none of chinook and coho: those rows show only when used.

// The button stays in place (no re-render), so the keyboard focus stays on it.
$('legend-body').addEventListener('click', e => {

// ---------- running now: Fraser test fisheries + tackle shop reports ----------
// Shows only current data: a series with no sample in RUN_MAX_AGE days (off season) is left out.
const RUN_MAX_AGE = 14, SHOP_MAX_AGE = 21, SHOP_SHOW = 5;
const SITES = {Albion:'Albion (Fort Langley)', Whonnock:'Whonnock (Maple Ridge)', Qualark:B('Qualark (біля Yale)', 'Qualark (near Yale)', 'Qualark (près de Yale)')};
const isoShift = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
const fmtIso = iso => fmt(iso.slice(5));

// Mean CPUE of the last 7 days against the 7 days before; null when a week has no sample.
function trend(days, last) {
  const mean = (from, to) => { const v = days.filter(d => d[0] > from && d[0] <= to).map(d => d[2]);
    return v.length ? v.reduce((a, b) => a + b) / v.length : null; };
  const now = mean(isoShift(last, -7), last), before = mean(isoShift(last, -14), isoShift(last, -7));
  if (now === null || before === null) return null;
  if (before === 0) return now > 0 ? 'up' : 'flat';
  return now / before > 1.25 ? 'up' : now / before < .8 ? 'down' : 'flat';
}

// 28-day bar strip. One slot per calendar day up to today, so all rows share one time axis.
// A day without a sample stays empty; a sample with no fish is a short gray tick on the baseline.
// Each series has its own height scale: the strip shows the shape of the run, the text gives the numbers.
const SPARK_DAYS = 28, SLOT = 8, BAR = 6, SPARK_H = 28;
function spark(s, today, recent) {
  const W = SPARK_DAYS * SLOT, first = isoShift(today, 1 - SPARK_DAYS);
  const top = Math.max(...s.days.map(d => d[1]));
  const peak = s.days.filter(d => d[1] === top).pop();
  let bars = '';
  s.days.forEach(([iso, n]) => {
    const i = Math.round((Date.parse(iso) - Date.parse(first)) / 864e5);
    if (i < 0 || i >= SPARK_DAYS) return;
    const x = i * SLOT + (SLOT - BAR) / 2, h = n ? Math.max(2, n / top * (SPARK_H - 1)) : 2, y = SPARK_H - h, r = Math.min(2, h / 2);
    // Rounded top, square base on the baseline.
    const d = `M${x},${SPARK_H}V${y + r}Q${x},${y} ${x + r},${y}H${x + BAR - r}Q${x + BAR},${y} ${x + BAR},${y + r}V${SPARK_H}Z`;
    bars += `<g><title>${esc(t('sparkDay', fmtIso(iso), n))}</title><rect x="${i * SLOT}" width="${SLOT}" height="${SPARK_H}" fill="transparent"/>`
      + `<path d="${d}" class="${!n ? 'z' : iso > recent ? 'now' : ''}"/></g>`;
  });
  const label = t('sparkLabel', spName(s.sp), tx(SITES[s.site] || s.site), top, fmtIso(peak[0]));
  return `<svg class="spark" width="${W}" height="${SPARK_H}" viewBox="0 0 ${W} ${SPARK_H}" role="img" aria-label="${esc(label)}" style="--c:var(${CAT_VAR[s.sp]})">`
    + `<line x1="0" x2="${W}" y1="${SPARK_H - .5}" y2="${SPARK_H - .5}"/>${bars}</svg>`;
}

// ---------- report pins: a bubble on each water that a recent shop report names ----------
// A report key is a water id or a tidal subarea ("28-8"). One pin per water; a tidal pin sits at the
// label point of the first named subarea, any other pin on the water's own line (anchorPoint).
// A manual report may have no url; any url it has must be https.
const freshShops = () => (REPORTS.reports || []).filter(r => r.date >= isoShift(todayISO(), -SHOP_MAX_AGE) && (!r.url || /^https:\/\//.test(r.url)));
const extLink = (url, html) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${html} ↗</a>` : html;
const manualTag = x => x.manual ? ` · <span class="man">${esc(t('manualTag'))}</span>` : '';
const waterOf = k => WATERS.find(w => w.id === k || (w.subs || []).includes(k));
const reportsFor = w => freshShops().filter(r => (r.w || []).some(k => waterOf(k) === w));
const PIN_SVG = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 3h8M2 6h8M2 9h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
map.createPane('pins').style.zIndex = 620;             // above the map labels (600), below tooltips and popups
const pins = L.layerGroup().addTo(map);
function renderPins() {
  pins.clearLayers();
  const first = new Map();                             // water -> the first key that names it
  freshShops().forEach(r => (r.w || []).forEach(k => { const w = waterOf(k); if (w && !first.has(w)) first.set(w, k); }));
  first.forEach((k, w) => {
    const n = reportsFor(w).length, sub = GEO.subpts[k] ? k : w.subs && w.subs[0];
    const ll = GEO.subpts[k] ? L.latLng(GEO.subpts[k][1], GEO.subpts[k][0]) : anchorPoint(w);
    const m = L.marker(ll, {pane:'pins', keyboard:true, riseOnHover:true, title:t('pinTitle', tx(w.name), n),
      icon: L.divIcon({className:'rep-pin', html:PIN_SVG + (n > 1 ? `<b>${n}</b>` : ''), iconSize:null, iconAnchor:[0, 24]})});
    m.on('add', () => m.getElement().setAttribute('aria-label', t('pinTitle', tx(w.name), n)));
    m.on('click', () => { skipMapClick = Date.now(); openPopup(w, ll, sub); });
    pins.addLayer(m);
  });
}

// ---------- uncertain limits: a "?" sign where the map draws a limit from an unclear description ----------
const unsure = L.layerGroup().addTo(map);
function renderUnsure() {
  unsure.clearLayers();
  (GEO.unsure || []).forEach(u => {
    const w = WATERS.find(x => x.id === u.w);
    if (!w || !unsureText(u.id)) return;
    const ll = L.latLng(u.ll[1], u.ll[0]), title = `${tx(w.name)}: ${t('unsureTitle')}`;
    const m = L.marker(ll, {pane:'pins', keyboard:true, riseOnHover:true, title,
      icon: L.divIcon({className:'unsure-pin', html:'?', iconSize:null, iconAnchor:[10, 10]})});
    m.on('add', () => m.getElement().setAttribute('aria-label', title));
    m.on('click', () => { skipMapClick = Date.now(); openUnsure(w, ll, u.id); });
    unsure.addLayer(m);
