}
const unsureText = id => (t('unsure') || {})[id] || I18N.en.unsure[id];
function openUnsure(w, ll, id) {
  reopen = () => openUnsure(w, ll, id);
  activePopup = L.popup(popupOpts(300)).setLatLng(ll).setContent(`<div class="pop"><h3>${esc(tx(w.name))}</h3>`
    + `<p class="sec">${esc(t('unsureTitle'))}</p><p>${esc(unsureText(id))}</p>${routeBlock(ll, {w})}</div>`).openOn(map);
}

// ---------- my spots: points that the viewer saves; they stay only in this browser (localStorage 'spots') ----------
// A spot: {id, lat, lng, name, note, w?}. w is the water whose popup saved the spot; the spot popup links to its rules.
// A spot link (?spots=) carries the spots as base64url JSON: a backup, and a way to another device or another angler.
const SPOT_MAX = 200;
const spotId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
// Stored data and link data come from outside the code, so every field is checked and cut to size.
const cleanSpot = s => s && Number.isFinite(s.lat) && Number.isFinite(s.lng) && Math.abs(s.lat) <= 90 && Math.abs(s.lng) <= 180 ? {
  id: typeof s.id === 'string' && s.id ? s.id.slice(0, 16) : spotId(), lat: +s.lat.toFixed(5), lng: +s.lng.toFixed(5),
  name: String(s.name ?? '').slice(0, 80), note: String(s.note ?? '').slice(0, 500),
  ...(WATERS.some(w => w.id === s.w) ? {w: s.w} : {})} : null;
const cleanSpots = a => Array.isArray(a) ? a.map(cleanSpot).filter(Boolean).slice(0, SPOT_MAX) : [];
const parseJSON = s => { try { return JSON.parse(s); } catch { return null; } };
const spotLabel = s => s.name.trim() || `${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}`;
const spotKey = s => `${s.lat},${s.lng}`;
let spots = cleanSpots(parseJSON(store.get('spots')));
let spotsVolatile = false;                             // the browser refuses to store: the spots live until the page closes
function saveSpots() {
  const json = JSON.stringify(spots);
  store.set('spots', json);
  spotsVolatile = store.get('spots') !== json;
  renderSpots();
  legend();
}
// Another tab changed the spots (or cleared the site data): take its list, so this tab does not overwrite it.
window.addEventListener('storage', e => {
  if (e.key !== 'spots' && e.key !== null) return;
  spots = cleanSpots(parseJSON(store.get('spots')));
  renderSpots();
  legend();
});

// Spot link: base64url of UTF-8 JSON [[lat, lng, name, note, water], …]. Link spots are added only after the viewer agrees.
const b64u = {
  enc: str => { let b = ''; new TextEncoder().encode(str).forEach(x => { b += String.fromCharCode(x); });
    return btoa(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  dec: str => new TextDecoder().decode(Uint8Array.from(atob(str.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0))),
};
const spotsLink = () => `${location.href.split(/[?#]/)[0]}?spots=`
  + b64u.enc(JSON.stringify(spots.map(s => [s.lat, s.lng, s.name, s.note, s.w || ''])));
let spotsIncoming = (() => {
  let raw = null, a = null;
  try { raw = new URLSearchParams(location.search).get('spots'); a = raw && JSON.parse(b64u.dec(raw)); } catch { /* a bad link adds nothing */ }
  const known = new Set(spots.map(spotKey));
  return cleanSpots(Array.isArray(a) ? a.map(x => Array.isArray(x) && {lat: x[0], lng: x[1], name: x[2], note: x[3], w: x[4]}) : [])
    .filter(s => !known.has(spotKey(s)) && known.add(spotKey(s)));
})();
// The link did its work (or has nothing new): remove ?spots=, so a reload or a bookmark does not ask again.
function dropSpotsParam() {
  try { if (new URLSearchParams(location.search).has('spots')) history.replaceState(null, '', location.pathname + location.hash); }
  catch { /* history may be blocked in a sandbox */ }
}
if (!spotsIncoming.length) dropSpotsParam();

// Leaflet moves the icon element with transform, so the pin shape is an inner span.
const SPOT_ICON = L.divIcon({className:'spot-pin', html:'<span></span>', iconSize:[22, 22], iconAnchor:[11, 27]});
const spotLayer = L.layerGroup().addTo(map);
function renderSpots() {
  spotLayer.clearLayers();
  spots.forEach(s => {
    const m = L.marker([s.lat, s.lng], {pane:'pins', keyboard:true, riseOnHover:true, title:spotLabel(s), icon:SPOT_ICON});
    m.on('add', () => m.getElement().setAttribute('aria-label', spotLabel(s)));
    m.on('click', () => { skipMapClick = Date.now(); openSpot(s.id); });
    spotLayer.addLayer(m);
  });
  const el = $('spots');
  el.hidden = !spots.length && !spotsIncoming.length;
  if (el.hidden) return;
  const items = spots.map(s => {
    const w = s.w && WATERS.find(x => x.id === s.w), sub = [w && tx(w.name), s.note.trim()].filter(Boolean).join(' · ');
    return `<li><button type="button" class="item" data-spot="${esc(s.id)}"><span class="spot-pin in-legend"><span></span></span>
      <span class="nm">${esc(spotLabel(s))}</span>${sub ? `<span class="lim">${esc(sub)}</span>` : ''}</button></li>`;
  }).join('');
  el.innerHTML = fold('spots', `<h2>${esc(t('spotsTitle'))} <span class="cnt">(${spots.length})</span></h2>`,
    (spotsIncoming.length ? `<div class="banner spots-in"><p>${esc(t('spotsImport', spotsIncoming.length))}</p>
      <button type="button" class="spots-skip">${esc(t('spotsSkip'))}</button><button type="button" class="spots-add">${esc(t('spotsAdd'))}</button></div>` : '')
    + (items ? `<ul>${items}</ul>` : '')
    + (spots.length ? `<button type="button" class="spots-copy">${esc(t('spotsLink'))}</button>
      <input class="spots-out" readonly hidden aria-label="${esc(t('spotsLink'))}">` : '')
    + `<p class="spots-note">${esc(t(spotsVolatile ? 'spotsVolatile' : 'spotsNote'))}</p>`);
}

// The spot popup edits in place: each key press saves. The handlers find the spot by id, because a change
// from another tab replaces the objects in the list.
function openSpot(id, focus) {
  const s = spots.find(x => x.id === id);
  if (!s) return;
  reopen = () => openSpot(id);
  const w = s.w && WATERS.find(x => x.id === s.w), ll = L.latLng(s.lat, s.lng);
  const node = document.createElement('div');
  node.className = 'pop spot';
  node.innerHTML = `<input class="spot-name" maxlength="80" aria-label="${esc(t('spotName'))}" placeholder="${esc(t('spotName'))}">
    <textarea class="spot-note" rows="2" maxlength="500" aria-label="${esc(t('spotNote'))}" placeholder="${esc(t('spotNote'))}"></textarea>
    ${w ? `<p class="note">${esc(t('spotWater'))}<button type="button" class="wlink">${esc(tx(w.name))}</button></p>` : ''}
    ${routeBlock(ll)}<button type="button" class="spot-del">${esc(t('spotDelete'))}</button>`;
  const name = node.querySelector('.spot-name'), note = node.querySelector('.spot-note'), del = node.querySelector('.spot-del');
  name.value = s.name;
  note.value = s.note;
  const edit = (k, v) => { const cur = spots.find(x => x.id === id); if (cur) { cur[k] = v; saveSpots(); } };
  name.addEventListener('input', () => edit('name', name.value));
  note.addEventListener('input', () => edit('note', note.value));
  node.querySelector('.wlink')?.addEventListener('click', () => openPopup(w, ll));
  // Delete asks for a second press within 4 s: there is no undo.
  del.addEventListener('click', () => {
    if (!del.dataset.armed) {
      del.dataset.armed = '1';
      del.textContent = t('spotDeleteSure');
      setTimeout(() => { delete del.dataset.armed; del.textContent = t('spotDelete'); }, 4000);
      return;
    }
    spots = spots.filter(x => x.id !== id);
    map.closePopup();
    saveSpots();
  });
  // The offset lifts the popup tip from the point to the top of the pin.
  activePopup = L.popup({...popupOpts(300), offset:[0, -20]}).setLatLng(ll).setContent(node).openOn(map);
  if (focus) { name.focus(); name.select(); }
}

// "Save to my spots" in any popup with a route block. The capture phase runs before Leaflet sees the click.
map.getContainer().addEventListener('click', e => {
  const b = e.target.closest('.spot-save');
  if (!b) return;
  e.stopPropagation();
  const w = WATERS.find(x => x.id === b.dataset.w);
  const s = cleanSpot({lat: +b.dataset.lat, lng: +b.dataset.lng, name: w ? tx(w.name) : t('spotDefault', spots.length + 1), w: w?.id});
  if (!s || spots.length >= SPOT_MAX) return;
  spots.push(s);
  saveSpots();
  openSpot(s.id, true);
}, true);

$('spots').addEventListener('click', e => {
  const item = e.target.closest('[data-spot]');
  if (item) return focusSpot(item.dataset.spot);
  const add = e.target.closest('.spots-add'), skip = e.target.closest('.spots-skip');
  if (add || skip) {
    if (add) spots = [...spots, ...spotsIncoming].slice(0, SPOT_MAX);
    spotsIncoming = [];
    dropSpotsParam();
    return saveSpots();
  }
  const copy = e.target.closest('.spots-copy');
  if (!copy) return;
  const link = spotsLink(), out = $('spots').querySelector('.spots-out');
  // No clipboard (an old browser, an insecure page, a sandbox): show the link in a field to copy by hand.
  const byHand = () => { out.hidden = false; out.value = link; out.focus(); out.select(); };
  if (!navigator.clipboard) return byHand();
  navigator.clipboard.writeText(link).then(() => {
    copy.textContent = t('spotsCopied');
    setTimeout(() => { copy.textContent = t('spotsLink'); }, 2000);
  }, byHand);
});

// ---------- my location: a GPS dot, to find the place to save as a spot ----------
// The position stays in the page: nothing stores or sends it. A click on the dot opens the point popup with "save".
// The first fix moves the map to the dot; later fixes only move the dot, so the map does not jump while the viewer pans.
map.createPane('me').style.zIndex = 420;               // above the waters (410), below the labels (600) and the pins
const R_ME = L.svg({pane:'me'});
const me = {on:false, ll:null, acc:0, dot:null, circle:null, btn:null};
const meTitle = () => t('meHere', Math.round(me.acc));
const LocateControl = L.Control.extend({
  options: {position:'topleft'},                       // added after the zoom control, so it sits under it
  onAdd() {
    const bar = L.DomUtil.create('div', 'leaflet-bar locate'), a = me.btn = L.DomUtil.create('a', '', bar);
    a.href = '#';
    a.setAttribute('role', 'button');
    a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>';
    L.DomEvent.disableClickPropagation(bar);
    L.DomEvent.on(a, 'click', e => { L.DomEvent.preventDefault(e); if (me.on) stopLocate(); else startLocate(); });
    return bar;
  },
});
new LocateControl().addTo(map);
function renderLocate() {
  const b = me.btn;
  b.title = t(me.on ? 'locateOff' : 'locate');
  b.setAttribute('aria-label', b.title);
  b.setAttribute('aria-pressed', String(me.on));
  b.classList.toggle('on', me.on);
  b.classList.toggle('wait', me.on && !me.ll);         // blinks until the first fix
  const el = me.dot && me.dot.getElement();
  if (el) { el.title = meTitle(); el.setAttribute('aria-label', el.title); }
}
function startLocate() {
  me.on = true;
  me.ll = null;
  renderLocate();
  map.locate({watch:true, enableHighAccuracy:true, maximumAge:10000, timeout:15000});
}
function stopLocate() {
  map.stopLocate();
  me.dot?.remove();
  me.circle?.remove();
  Object.assign(me, {on:false, ll:null, dot:null, circle:null});
  renderLocate();
}
// A short message over the map: the page has no other place for a message without a position.
let msgTimer = 0;
function mapMsg(text) {
  $('map-msg').textContent = text;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { $('map-msg').textContent = ''; }, 6000);
}
// The popup title follows a language switch, so reopen reads the title again.
const openMe = () => { if (!me.ll) return; openPointPopup(me.ll, meTitle()); reopen = openMe; };
map.on('locationfound', e => {
  if (!me.on) return;
  const first = !me.ll;
  me.ll = e.latlng;
  me.acc = e.accuracy;
  if (!me.dot) {
    me.circle = L.circle(me.ll, {renderer:R_ME, pane:'me', radius:me.acc, weight:1, interactive:false, className:'me-acc'}).addTo(map);
    me.dot = L.marker(me.ll, {pane:'pins', keyboard:true, zIndexOffset:1000,
      icon:L.divIcon({className:'me-dot', iconSize:[18, 18]})}).addTo(map);
    me.dot.on('click', () => { skipMapClick = Date.now(); openMe(); });
  } else {
    me.dot.setLatLng(me.ll);
    me.circle.setLatLng(me.ll).setRadius(me.acc);
  }
  renderLocate();
  if (!first) return;
  if (map.options.maxBounds.contains(me.ll)) map.flyTo(me.ll, Math.max(map.getZoom(), 15), {duration:.6});
  else mapMsg(t('meOutside'));
});
// Before the first fix an error ends the search. After it, a lost signal keeps the last position.
map.on('locationerror', e => {
  if (!me.on || me.ll) return;
  stopLocate();
  mapMsg(t(e.code === 1 ? 'meDenied' : 'meFail'));
});

// ---------- water level: ECCC real-time gauges (build/fetch_hydro.py) ----------
// The level is metres above the zero of each gauge, so a gauge is compared only with itself:
// the change in 24 hours and the 14-day line. A gauge whose newest reading is too old is hidden.
const LV_MAX_AGE = 48 * 36e5, LV_SPAN = 14 * 864e5, LV_W = 224, LV_H = 40, LV_MIN_RANGE = .1;
const gaugesFresh = () => (HYDRO.stations || []).filter(s => s.now && Date.now() - Date.parse(s.now[0]) < LV_MAX_AGE
  && WATERS.some(w => w.id === s.w));
const gaugeFor = w => gaugesFresh().find(s => s.w === w.id);
const LOCALES = {uk:'uk-UA', en:'en-CA', fr:'fr-CA'};
const metres = v => `${v.toLocaleString(LOCALES[LANG], {minimumFractionDigits:2, maximumFractionDigits:2})} ${t('unitM')}`;
const flowText = v => `${v.toLocaleString(LOCALES[LANG], {maximumSignificantDigits:3})} ${t('unitQ')}`;
const localISO = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtStamp = iso => { const d = new Date(iso); return `${fmtIso(localISO(d))}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const gaugeUrl = s => `https://wateroffice.ec.gc.ca/report/real_time_${LANG === 'fr' ? 'f' : 'e'}.html?stn=${encodeURIComponent(s.id)}`;

// [time ms, level] of each hour (plotted at mid-hour) and of the newest reading, oldest first, gaps left out.
function gaugePoints(s) {
  const t0 = Date.parse(s.t0) + 18e5, now = Date.parse(s.now[0]);
  return [...s.lv.map((v, i) => [t0 + i * 36e5, v]).filter(([x, v]) => v !== null && x < now), [now, s.now[1]]];
}

// Level change since the reading nearest to 24 hours before the newest one (within 2 hours), or null.
function change24(s, pts) {
  const at = Date.parse(s.now[0]) - 864e5;
  const near = pts.reduce((b, p) => Math.abs(p[0] - at) < Math.abs(b[0] - at) ? p : b, pts[0]);
  return Math.abs(near[0] - at) <= 2 * 36e5 ? s.now[1] - near[1] : null;
}

// 14-day line on one time axis for all gauges (up to now). A gap of more than 3 hours breaks the line.
// The vertical range is at least LV_MIN_RANGE, so a few millimetres of noise do not look like a flood.
function levelChart(s, pts, name) {
  const end = Date.now(), start = end - LV_SPAN;
  const p = pts.filter(([x]) => x >= start);
  const vals = p.map(([, v]) => v), lo0 = Math.min(...vals), hi0 = Math.max(...vals);
  const mid = (lo0 + hi0) / 2, half = Math.max(hi0 - lo0, LV_MIN_RANGE) / 2, lo = mid - half, hi = mid + half;
  const X = x => (x - start) / LV_SPAN * LV_W, Y = v => LV_H - 3 - (v - lo) / (hi - lo) * (LV_H - 6);
  let d = '', prev = null;
  p.forEach(([x, v]) => { d += `${prev !== null && x - prev <= 3 * 36e5 ? 'L' : 'M'}${X(x).toFixed(1)},${Y(v).toFixed(1)}`; prev = x; });
  // Local midnights: a tick on the base line and a hover slot with the range of that day.
  let days = '';
  for (let m = new Date(start).setHours(24, 0, 0, 0) - 864e5; m < end; m = new Date(m).setHours(24, 0, 0, 0)) {
    const a = Math.max(m, start), b = Math.min(new Date(m).setHours(24, 0, 0, 0), end);
    const v = p.filter(([x]) => x >= a && x < b).map(([, y]) => y);
    if (m >= start) days += `<line x1="${X(m).toFixed(1)}" x2="${X(m).toFixed(1)}" y1="${LV_H - 4}" y2="${LV_H}"/>`;
    if (v.length) days += `<g><title>${esc(t('lvDay', fmtIso(localISO(a)), metres(Math.min(...v)), metres(Math.max(...v))))}</title>`
      + `<rect x="${X(a).toFixed(1)}" width="${(X(b) - X(a)).toFixed(1)}" height="${LV_H}" fill="transparent"/></g>`;
  }
  const [lx, lv] = p[p.length - 1];
  return `<svg class="lv" width="${LV_W}" height="${LV_H}" viewBox="0 0 ${LV_W} ${LV_H}" role="img" aria-label="${esc(t('lvChart', name, metres(lo0), metres(hi0)))}">`
    + `<line x1="0" x2="${LV_W}" y1="${LV_H - .5}" y2="${LV_H - .5}"/>${days}<path class="ln" d="${d}"/>`
    + `<circle cx="${X(lx).toFixed(1)}" cy="${Y(lv).toFixed(1)}" r="2.5"/></svg>`;
}

// Level now, flow, reading time, 24-hour change, the 14-day line and the station link.
function gaugeBlock(s, name, where) {
  const pts = gaugePoints(s), [iso, lv, q] = s.now, ch = change24(s, pts);
  const vals = pts.filter(([x]) => x >= Date.now() - LV_SPAN).map(([, v]) => v);
  const arrow = ch === null ? '' : Math.abs(ch) < .005 ? '→ ' : ch > 0 ? '↑ ' : '↓ ';
  return `<p class="lv-now"><b>${esc(metres(lv))}</b>${q !== null ? ` · ${esc(flowText(q))}` : ''} · ${esc(fmtStamp(iso))}</p>`
    + (ch === null ? '' : `<p class="lv-sub">${esc(t('lv24', arrow + metres(Math.abs(ch))))}</p>`)
    + levelChart(s, pts, name)
    + `<p class="lv-sub">${esc(t('lvRange', metres(Math.min(...vals)), metres(Math.max(...vals))))}</p>`
    + `<p class="lv-sub">${extLink(gaugeUrl(s), esc(t('gaugeAt', s.name)))}</p>`
    + (where ? `<button type="button" class="wlink gauge-go" data-gauge="${esc(s.id)}">${esc(t('gaugeWhere'))}</button>` : '');
}

const GAUGE_SVG = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 4.5q1.25-1.6 2.5 0t2.5 0 2.5 0 2.5 0M1 8.5q1.25-1.6 2.5 0t2.5 0 2.5 0 2.5 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
const gauges = L.layerGroup().addTo(map);
function renderGauges() {
  gauges.clearLayers();
  gaugesFresh().forEach(s => {
    const w = WATERS.find(x => x.id === s.w), ll = L.latLng(s.ll[1], s.ll[0]), title = t('gaugeTitle', s.name, metres(s.now[1]));
    const m = L.marker(ll, {pane:'pins', keyboard:true, riseOnHover:true, title,
      icon: L.divIcon({className:'gauge-pin', html:GAUGE_SVG, iconSize:null, iconAnchor:[11, 11]})});
    m.on('add', () => m.getElement().setAttribute('aria-label', title));
    m.on('click', () => { skipMapClick = Date.now(); openGauge(s, w); });
    gauges.addLayer(m);
  });
}
function openGauge(s, w) {
  const ll = L.latLng(s.ll[1], s.ll[0]);
  reopen = () => openGauge(s, w);
  activePopup = L.popup(popupOpts(300)).setLatLng(ll).setContent(`<div class="pop"><h3>${esc(tx(w.name))}</h3>`
    + `<p class="sec">${esc(t('lvTitle'))}</p>${gaugeBlock(s, tx(w.name), false)}<p class="note">${esc(t('lvNote'))}</p>${routeBlock(ll, {w})}</div>`).openOn(map);
}
// Fly to the gauge and open its popup. A hidden gauge legend row is switched on again, so the marker shows.
function focusGauge(id) {
  const s = gaugesFresh().find(x => x.id === id);
  if (!s) return;
  if (hiddenRows.delete('gauges')) { applyHidden(); legend(); }
  const w = WATERS.find(x => x.id === s.w), ll = L.latLng(s.ll[1], s.ll[0]);
  setSheet('peek');
  map.flyToBounds(L.latLngBounds(ll, ll), {...mapPadding(60), maxZoom:13, duration:.6});
  let shown = false;
  const show = () => { if (!shown) { shown = true; map.stop(); openGauge(s, w); } };
  map.once('moveend', show);
  setTimeout(show, 900);
}
// Popups stop click propagation, so the "show the gauge" button inside a popup is read in the capture phase.
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.leaflet-popup [data-gauge]');
  if (b) { skipMapClick = Date.now(); focusGauge(b.dataset.gauge); }
}, true);

function renderRun() {
  renderPins();
  renderGauges();
  const today = todayISO();
  const series = (REPORTS.testfish || []).filter(s => s.days.length && s.days[s.days.length - 1][0] >= isoShift(today, -RUN_MAX_AGE));
  const shops = freshShops();
  // Water levels: gauges on the waters that are open today (retention or release), whatever the selected date.
  const md = today.slice(5);
  const levels = gaugesFresh().map(s => ({s, w: WATERS.find(x => x.id === s.w)}))
    .filter(({w}) => !['closed', 'inactive', 'fraser'].includes(evaluate(w, 'all', md).cat))
    .sort((a, b) => tx(a.w.name).localeCompare(tx(b.w.name)));
  $('run').hidden = !series.length && !shops.length && !levels.length;
  if ($('run').hidden) return;
  const dot = sp => `<span class="dot" style="--c:var(${CAT_VAR[sp]})"></span>`;
  const rows = series.map(s => {
    const [last, n] = s.days[s.days.length - 1];
    const recent = isoShift(last, -7);                     // the same 7 days as the total and the bright bars
    const wk = s.days.filter(d => d[0] > recent).reduce((a, d) => a + d[1], 0);
    const tr = trend(s.days, last);
    const site = extLink(s.url, `${esc(tx(SITES[s.site] || s.site))} · ${esc(s.src)}`)
      + (s.id === 'albion-coho' ? ` · ${esc(t('runInNet'))}` : '') + manualTag(s);
    return `<li class="item">${dot(s.sp)}<span class="nm">${esc(spName(s.sp))} <small>${site}</small></span>
      <span class="lim">${esc(t('runLine', fmtIso(last), n, wk))}${tr ? `<br>${esc(t('trend')[tr])}` : ''}</span>${spark(s, today, recent)}</li>`;
  }).join('');
  // A key is a water id or a tidal subarea; unknown keys are skipped, and two keys of one group show once.
  const waters = r => [...new Set((r.w || []).map(k => WATERS.find(w => w.id === k || (w.subs || []).includes(k))).filter(Boolean))];
  const reps = shops.map(r => `<li class="item"><span></span><span class="nm">${extLink(r.url, esc(r.title))}</span>
      <span class="lim">${esc(r.src)}${manualTag(r)} · ${fmtIso(r.date)}${r.sp.length ? ` · ${esc(t('mentioned'))}${r.sp.map(sp => `${dot(sp)} ${esc(spLow(sp))}`).join(', ')}` : ''}
      ${waters(r).length ? `<span class="wl">${esc(t('watersIn'))}${waters(r).map(w => `<button type="button" class="wlink" data-id="${w.id}">${esc(tx(w.name))}</button>`).join('')}</span>` : ''}</span></li>`);
  // The newest SHOP_SHOW reports stay open; the rest fold under "show N more". The pins and popups keep all of them.
  const moreOpen = !!($('run').querySelector('details.more') || {}).open;   // keep the choice across a language switch
  $('run').innerHTML = fold('run', `<h2>${esc(t('runTitle'))}</h2>`,
    (rows ? `<p class="run-lede">${esc(t('runLede'))}</p><ul>${rows}</ul>` : '')
    + (levels.length ? fold('levels', `<h3>${esc(t('lvTitle'))} <span class="cnt">(${levels.length})</span></h3>`,
      `<p class="run-lede">${esc(t('lvLede'))}</p><ul>${levels.map(({s, w}) => `<li class="item"><span class="dot" style="--c:var(--c-water)"></span>`
        + `<span class="nm"><button type="button" class="wlink" data-id="${w.id}">${esc(tx(w.name))}</button></span>`
        + `<div class="lim">${gaugeBlock(s, tx(w.name), true)}</div></li>`).join('')}</ul><p class="run-note">${esc(t('lvNote'))}</p>`) : '')
    + (reps.length ? fold('shops', `<h3>${esc(t('shopTitle'))} <span class="cnt">(${reps.length})</span></h3>`,
      `<ul>${reps.slice(0, SHOP_SHOW).join('')}</ul>`
      + (reps.length > SHOP_SHOW ? `<details class="more"${moreOpen ? ' open' : ''}><summary>${esc(t('showMore', reps.length - SHOP_SHOW))}</summary>`
        + `<ul>${reps.slice(SHOP_SHOW).join('')}</ul></details>` : '')) : '')
    + `<p class="run-note">${esc(t('runNote', REPORTS.generated ? fmtFull(REPORTS.generated.slice(0, 10)) : '—'))}</p>`);
}

function render() {
  const {sp, md, lic} = state;
  const res = WATERS.filter(licensed).map(w => ({w, ...evaluate(w, sp, md)}));
  WATERS.forEach(w => { if (!licensed(w)) styleWater(w, 'other'); });
  res.forEach(({w, cat}) => styleWater(w, cat));
  layers['a29-mouth'].poly.bringToFront();
  applyHidden();

  const fresh = res.filter(r => !r.w.tidal && !r.w.closure);
  const tidal = res.filter(r => r.w.tidal && !r.w.closure);
  const nSubs = rs => rs.reduce((a, r) => a + r.w.subs.length, 0);
  const fo = fresh.filter(r => RETAIN.has(r.cat)).length;
  const to = nSubs(tidal.filter(r => RETAIN.has(r.cat)));
  const rel = fresh.filter(r => r.cat === 'release').length + nSubs(tidal.filter(r => r.cat === 'release'));
  const acc = SP_ACC[LANG][sp];
  $('summary').innerHTML = lic === 'fresh' ? t('summaryFresh', acc, fo, fresh.length, fmt(md), rel)
    : lic === 'tidal' ? t('summaryTidal', acc, to, nSubs(tidal), fmt(md), rel)
    : t('summary', acc, fo, fresh.length, to, nSubs(tidal), fmt(md), rel);
  const none = fo + to === 0;
  $('banner').hidden = !none;
  if (none) $('banner').textContent = t('banner', spName(sp), fmt(md), rel, lic !== 'tidal');

  const ORDER = {both:0, chinook:0, coho:0, chum:0, pink:0, sockeye:0, release:1, inactive:2, closed:2, fraser:3};
  $('groups').innerHTML = Object.entries(DISTRICTS).map(([d, title]) => {
    const items = res.filter(r => r.w.d === d)
      .sort((a, b) => (ORDER[a.cat] - ORDER[b.cat]) || tx(a.w.name).localeCompare(tx(b.w.name)));
    if (!items.length) return '';                       // a district outside the viewer's licence
    return `<section class="group">${fold('grp-' + d, `<h2>${esc(tx(title))}</h2>`, `<ul>${items.map(({w, cat, text}) => {
      const off = cat === 'closed' || cat === 'inactive';
      return `<li><button type="button" class="item ${off ? 'is-off' : ''}" data-id="${w.id}">
        <span class="dot ${off ? 'off' : ''} ${w.tidal ? 'sq' : ''}" style="--c:var(${CAT_VAR[cat]})"></span>
        <span class="nm">${esc(tx(w.name))}${w.subsLabel ? ` <small>${esc(tx(w.subsLabel))}</small>` : ''}</span><span class="lim">${esc(text)}</span></button></li>`;
    }).join('')}</ul>`)}</section>`;
  }).join('');
  legend();
  map.closePopup();
}

const fmtDateTime = iso => {
  const d = new Date(iso), p2 = n => String(n).padStart(2, '0');
  return `${fmtFull(`${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`)}, ${p2(d.getHours())}:${p2(d.getMinutes())}`;
};
function renderStatus() {
  const src = RULES.sources || {}, dd = k => src[k] && src[k].dfoDate ? fmtFull(src[k].dfoDate) : '—';
  $('status-line').innerHTML = [
    STATUS.checkedAt ? t('checked', esc(fmtDateTime(STATUS.checkedAt))) : esc(t('notChecked')),
    STATUS.rulesChanged ? t('rulesChanged', esc(fmtFull(STATUS.rulesChanged))) : '',
    esc(t('dfoDates', dd('region2'), dd('area28'), dd('area29'))),
  ].filter(Boolean).join(' ');
  const pend = STATUS.pending;
  $('pending').hidden = !pend;
  if (pend) $('pending').textContent = t('pending', fmtFull(pend.since));
  const chip = $('dfo-chip');
  chip.classList.toggle('warn', !!pend);
  chip.textContent = pend ? t('chipWarn') : t('chipOk', STATUS.checkedAt ? fmtDateTime(STATUS.checkedAt).split(',')[0] : fmtFull(STATUS.rulesChanged || RULES.sources.region2.dfoDate));
}
$('dfo-chip').addEventListener('click', () => {
  setSheet('full');
  $(STATUS.pending ? 'pending' : 'status-line').scrollIntoView({behavior:'smooth', block:'center'});
});

// ---------- bottom sheet (phones) ----------
// Below WIDE the panel is a bottom sheet with three detents: 'peek' shows the title and the controls,
// 'half' covers half the screen, 'full' shows the whole panel and scrolls. Drag the sheet or tap the grip.
const WIDE = window.matchMedia('(min-width:768px)');
const root = document.documentElement;
const sheet = {el: $('panel'), body: $('panel-body'), grip: $('grip'), state: 'peek', peek: 0, full: 0, vis: 0, safeBottom: 0, noClickUntil: 0};
const DETENTS = ['peek', 'half', 'full'];
const detentVis = s => s === 'full' ? sheet.full : s === 'half' ? Math.max(sheet.peek, Math.round(sheet.full * .55)) : sheet.peek;
const setVis = v => { sheet.vis = v; root.style.setProperty('--sheet-vis', `${v}px`); };

// Peek ends below the date row. The measure adds the body scroll offset, and the translateY of the sheet cancels out.
function measureSheet() {
  const top = sheet.el.getBoundingClientRect().top;
  sheet.safeBottom = parseFloat(getComputedStyle(sheet.el).paddingBottom) || 0;
  sheet.full = sheet.el.offsetHeight;
  sheet.peek = Math.min(sheet.full, Math.ceil($('date-row').getBoundingClientRect().bottom - top + sheet.body.scrollTop + 14 + sheet.safeBottom));
}

function setSheet(s) {
  if (WIDE.matches) return;
  sheet.state = s;
  root.dataset.sheet = s;
  if (s !== 'full') sheet.body.scrollTop = 0;          // only a full sheet scrolls
  setVis(detentVis(s));
  sheet.grip.setAttribute('aria-expanded', String(s !== 'peek'));
  sheet.grip.setAttribute('aria-label', t(s === 'full' ? 'sheetCollapse' : 'sheetExpand'));
}

function layoutSheet() {
  if (WIDE.matches) { delete root.dataset.sheet; root.style.removeProperty('--sheet-vis'); return; }
  measureSheet();
  setSheet(sheet.state);
}

sheet.grip.addEventListener('click', () => setSheet({peek: 'half', half: 'full', full: 'peek'}[sheet.state]));

// Drag. A full sheet scrolls its content natively, so there only the grip drags it.
// A mostly horizontal move is not a sheet drag.
// Moves are read on window: a mouse, unlike a finger, has no implicit pointer capture.
let drag = null;
sheet.el.addEventListener('pointerdown', e => {
  if (WIDE.matches || !e.isPrimary || e.button > 0) return;
  if (sheet.state === 'full' && !sheet.grip.contains(e.target)) return;
  drag = {id: e.pointerId, x: e.clientX, y: e.clientY, vis: sheet.vis, moved: false, lastY: e.clientY, lastT: e.timeStamp, v: 0};
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved) {
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { drag = null; return; }
    if (Math.abs(dy) < 8) return;
    drag.moved = true;
    getSelection().removeAllRanges();                   // a mouse drag starts a text selection
    sheet.el.setPointerCapture(e.pointerId);
    root.classList.add('sheet-drag');
  }
  const dt = e.timeStamp - drag.lastT;
  if (dt > 0) drag.v = (drag.lastY - e.clientY) / dt;   // px/ms, up is positive
  drag.lastY = e.clientY; drag.lastT = e.timeStamp;
  setVis(Math.min(sheet.full, Math.max(sheet.peek, drag.vis - dy)));
});
const endDrag = e => {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  if (!d.moved) return;
  root.classList.remove('sheet-drag');
  sheet.noClickUntil = performance.now() + 400;        // the drag must not also press the button under the finger
  const vis = DETENTS.map(detentVis);
  let i = vis.reduce((best, v, k) => Math.abs(v - sheet.vis) < Math.abs(vis[best] - sheet.vis) ? k : best, 0);
  if (Math.abs(d.v) > .4) {                             // a flick goes to the next detent in its direction
    i = d.v > 0 ? vis.findIndex(v => v > sheet.vis + 1) : vis.findLastIndex(v => v < sheet.vis - 1);
    if (i < 0) i = d.v > 0 ? DETENTS.length - 1 : 0;
  }
  setSheet(DETENTS[i]);
};
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
sheet.el.addEventListener('click', e => {
  if (performance.now() < sheet.noClickUntil) { e.preventDefault(); e.stopPropagation(); }
}, true);

// Keyboard: focus below the visible part opens the sheet fully; Escape collapses it.
sheet.body.addEventListener('focusin', e => {
  if (WIDE.matches || sheet.state === 'full') return;
  // Position inside the sheet, so a running transition of the sheet cancels out.
  const top = sheet.el.getBoundingClientRect().top, r = e.target.getBoundingClientRect();
  if (r.top < top || r.bottom - top > sheet.vis - sheet.safeBottom) {
    setSheet('full');
    e.target.scrollIntoView({block: 'nearest'});
  }
});
sheet.el.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || WIDE.matches || sheet.state === 'peek') return;
  setSheet('peek');
  sheet.grip.focus();
});

// Web fonts, a language switch and the browser toolbar change the sizes.
const sheetRO = new ResizeObserver(layoutSheet);
[sheet.el, document.querySelector('.head'), $('species'), $('date-row')].forEach(el => sheetRO.observe(el));

function applyLang(lang, save) {
  LANG = lang;
  if (save) store.set('lang', lang);
  document.documentElement.lang = lang;
  document.title = t('title');
  $('t-eyebrow').textContent = t('eyebrow');
  $('t-h1').textContent = t('h1');
  $('t-lede').textContent = t('lede');
  $('sp-label').textContent = t('spLabel');
  $('date-label').textContent = t('dateLabel');
  $('today').textContent = t('today');
  $('map').setAttribute('aria-label', t('mapLabel'));
  const open = $('rules').open;
  $('rules').innerHTML = t('rules');
  $('rules').open = open;
  $('foot').innerHTML = t('foot');
  renderAttribution();
  renderTheme();
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  const wasOpen = activePopup && map.hasLayer(activePopup) && reopen;
  renderSpecies();
  renderSpCard();
  renderLicence();
  renderStatus();
  renderRun();
  renderUnsure();
  renderSpots();
  renderLocate();
  renderSearch();
  render();
  layoutSheet();
  if (wasOpen) wasOpen();
}

$('species').addEventListener('change', e => { state.sp = e.target.value; renderSpCard(); render(); });
$('licence').addEventListener('change', e => { state.lic = e.target.value; store.set('lic', state.lic); render(); });
$('date').addEventListener('change', e => { if (e.target.value) { state.md = e.target.value.slice(5); render(); } });
$('today').addEventListener('click', () => { $('date').value = todayISO(); state.md = $('date').value.slice(5); render(); });
document.querySelector('.lang').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  applyLang(b.dataset.lang, true);
  if (fromHash() && fromHash() !== LANG) location.hash = LANG;   // a stale #uk/#en would win on reload
});
window.addEventListener('hashchange', () => { const l = fromHash(); if (l && l !== LANG) applyLang(l, true); });
$('groups').addEventListener('click', e => { const b = e.target.closest('.item'); if (b) focusWater(b.dataset.id); });
$('run').addEventListener('click', e => {
  const g = e.target.closest('[data-gauge]'), b = e.target.closest('.wlink');
  if (g) focusGauge(g.dataset.gauge); else if (b) focusWater(b.dataset.id);
});
// Flies the map, then opens a popup.
function flyThen(fly, open) {
  setSheet('peek');
  fly();
  // A flight may not emit 'moveend' when the view does not change, so a timer is the fallback.
  let shown = false;
  // map.stop() ends a still-running flight: Leaflet skips popup auto-pan while the map animates.
  const show = () => { if (!shown) { shown = true; map.stop(); open(); } };
  map.once('moveend', show);
  setTimeout(show, 900);
}
function focusWater(id) {
  const w = WATERS.find(x => x.id === id), L_ = layers[w.id];
  flyThen(() => map.flyToBounds((L_.poly || L_.line).getBounds(), {...mapPadding(60), maxZoom:13, duration:.6}),
    () => openPopup(w, null, w.subs && w.subs[0]));
}
function focusSpot(id) {
  const s = spots.find(x => x.id === id);
  if (s) flyThen(() => map.flyTo([s.lat, s.lng], Math.max(map.getZoom(), 14), {duration:.6}), () => openSpot(id));
}
// Fit padding that keeps a feature clear of the map controls and, on a phone, of the peeking sheet.
const mapPadding = p => WIDE.matches ? {padding:[p, p]} : {paddingTopLeft:[p / 2, p + 10], paddingBottomRight:[p / 2, sheet.peek + p / 2]};

// ---------- search: coordinates, map waters and subareas locally; other places via Nominatim ----------
// Coordinates: decimal degrees, degrees + minutes, or degrees + minutes + seconds, with signs or N/S/E/W,
// in either order. A pasted map link works too: the first "lat,lng" pair in it counts.
// Returns an L.LatLng, or null when the text is not a coordinate pair.
function parseLatLng(q) {
  const link = /^https?:\/\//i.test(q.trim()) && q.match(/(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  const comma = q.match(/^\s*([+-]?\d{1,3}),(\d+)\s*[;\s]\s*([+-]?\d{1,3}),(\d+)\s*$/);   // decimal commas: "49,1 -121,9"
  const s = link ? `${link[1]} ${link[2]}` : comma ? `${comma[1]}.${comma[2]} ${comma[3]}.${comma[4]}`
    : q.toUpperCase().replace(/[°º'′’"″”,;]/g, ' ');
  const TOKEN = /[NSEW]|[+-]?\d+(?:\.\d+)?/g;
  if (s.replace(TOKEN, '').trim()) return null;           // other letters or signs: a place name
  // Groups of 1–3 numbers (degrees, minutes, seconds). A letter before or after a group is its hemisphere.
  const groups = [];
  let g = {nums: [], hemi: null};
  for (const tok of s.match(TOKEN) || []) {
    if (/\d/.test(tok)) { g.nums.push(Number(tok)); continue; }
    if (!g.nums.length) { if (g.hemi) return null; g.hemi = tok; }               // "N 49"
    else if (!g.hemi) { g.hemi = tok; groups.push(g); g = {nums: [], hemi: null}; }   // "49 N"
    else { groups.push(g); g = {nums: [], hemi: tok}; }                          // "N 49 W 121": W starts the next group
  }
  if (g.nums.length) groups.push(g); else if (g.hemi) return null;
  // No letters: "49 6 30 121 58 3" is split in the middle.
  if (groups.length === 1 && !groups[0].hemi && [2, 4, 6].includes(groups[0].nums.length)) {
    const n = groups[0].nums, h = n.length / 2;
    groups.splice(0, 1, {nums: n.slice(0, h), hemi: null}, {nums: n.slice(h), hemi: null});
  }
  if (groups.length !== 2 || groups.some(x => !x.nums.length || x.nums.length > 3)) return null;
  const isLat = h => h === 'N' || h === 'S', isLng = h => h === 'E' || h === 'W';
  let [a, b] = groups;
  if (isLng(a.hemi) || isLat(b.hemi)) [a, b] = [b, a];                                        // "121W 49N"
  if (isLng(a.hemi) || isLat(b.hemi)) return null;                                            // "49N 121N"
  const deg = ({nums: [d, m = 0, sec = 0], hemi}, n) => {
    if (m < 0 || m >= 60 || sec < 0 || sec >= 60 || (n > 1 && !Number.isInteger(d))) return NaN;
    const v = Math.abs(d) + m / 60 + sec / 3600;
    return (d < 0 || hemi === 'S' || hemi === 'W') ? -v : v;
  };
  let lat = deg(a, a.nums.length), lng = deg(b, b.nums.length);
  if (!a.hemi && !b.hemi && Math.abs(lat) > 90 && Math.abs(lng) <= 90) [lat, lng] = [lng, lat];   // "-121.9, 49.1"
  if (!(Math.abs(lat) <= 90 && Math.abs(lng) <= 180)) return null;
  // "49.1, 121.9" without a minus or a W: on this map that is west longitude.
  if (!b.hemi && lng > 0 && !MAP_BOUNDS.contains([lat, lng]) && MAP_BOUNDS.contains([lat, -lng])) lng = -lng;
  return L.latLng(lat, lng);
}

// Case and accent do not matter: "chehalis" finds "Chehalis", "riviere" finds "rivière".
const plain = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
// Local results, with no network: a subarea code, a coordinate pair, or the map waters whose name
// (in any language) has every typed word. Returns null for a coordinate pair outside the map.
function localResults(q) {
  const code = q.trim().match(/^(2[89])\s*[-–.]\s*(\d{1,2})$/), sub = code && `${code[1]}-${Number(code[2])}`;
  const tw = sub && GEO.subpts[sub] && WATERS.find(w => w.subs && w.subs.includes(sub));
  if (tw) return [{kind: 'sub', ll: L.latLng(GEO.subpts[sub][1], GEO.subpts[sub][0]), code: sub, w: tw,
    title: t('subarea', sub), sub: tx(tw.name)}];
  const ll = parseLatLng(q);
  if (ll) return MAP_BOUNDS.contains(ll)
    ? [{kind: 'point', ll, title: `${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`, sub: t('searchCoords')}] : null;
  const words = plain(q).split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  return WATERS.filter(w => namesOf(w).some(n => words.every(x => n.includes(x))))
    .slice(0, 6).map(w => ({kind: 'water', id: w.id, title: tx(w.name), sub: t('searchWater', !!w.tidal)}));
}
const namesOf = w => (w.name && typeof w.name === 'object' ? Object.values(w.name) : [w.name]).map(plain);
const mapWaterNames = WATERS.flatMap(namesOf);

// Nominatim usage policy: at most 1 request per second, no search-as-you-type, OSM attribution (the map shows it),
// a Referer that identifies the site (the browser sends it). The page asks only on Enter and keeps a cache.
// viewbox + bounded=1: only places inside the map area.
const NOMINATIM = 'https://nominatim.openstreetmap.org/search';
const placeCache = new Map();
let lastPlaceReq = 0, placeCtl = null;
async function placeResults(q) {
  const key = `${LANG}|${plain(q)}`;
  if (placeCache.has(key)) return placeCache.get(key);
  placeCtl?.abort();
  const ctl = placeCtl = new AbortController();
  const wait = lastPlaceReq + 1000 - Date.now();
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  if (ctl.signal.aborted) throw new DOMException('aborted', 'AbortError');
  lastPlaceReq = Date.now();
  const vb = [MAP_BOUNDS.getWest(), MAP_BOUNDS.getNorth(), MAP_BOUNDS.getEast(), MAP_BOUNDS.getSouth()].join(',');
  const url = `${NOMINATIM}?format=jsonv2&limit=10&bounded=1&viewbox=${vb}&accept-language=${LANG}&q=${encodeURIComponent(q)}`;
  const res = await fetch(url, {signal: ctl.signal});
  if (!res.ok) throw new Error(`Nominatim ${res.status}`);
  // OSM splits a river into many ways with one name: one river result per name.
  // A river or lake that is a map water is left out: the local result opens its rules.
  // Other places: one result per name and context (a dam and its power plant have the same name and place).
  const seen = new Set(), out = [];
  for (const r of await res.json()) {
    const parts = r.display_name.split(', '), title = r.name || parts[0];
    const sub = parts.slice(1).filter(p => !/\d/.test(p)).slice(0, 2).join(', ');   // no house numbers, no postal codes
    const water = r.category === 'waterway' || (r.category === 'natural' && r.type === 'water');
    const p = plain(title), keys = water ? [`${p}|${sub}`, `~${p}`] : [`${p}|${sub}`];
    if (keys.some(k => seen.has(k)) || (water && mapWaterNames.some(n => n.includes(p)))) continue;
    keys.forEach(k => seen.add(k));
    const bb = (r.boundingbox || []).map(Number);    // [south, north, west, east]
    out.push({kind: 'place', ll: L.latLng(+r.lat, +r.lon), title, sub,
      bounds: bb.length === 4 ? L.latLngBounds([bb[0], bb[2]], [bb[1], bb[3]]) : null});
  }
  placeCache.set(key, out.slice(0, 6));
  return placeCache.get(key);
}

const SearchControl = L.Control.extend({
  options: {position: 'topleft'},                     // added after the zoom control, so it sits under it
  onAdd() {
    const box = L.DomUtil.create('div', 'search-ctl');
    box.innerHTML = `<div class="leaflet-bar"><a href="#" role="button" id="search-btn" aria-expanded="false" aria-controls="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></a></div>
      <form class="search-box" id="search-box" role="search" hidden>
        <input type="search" id="search-q" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
        <ul class="search-res" id="search-res"></ul>
        <p class="search-msg" id="search-msg" role="status" aria-live="polite"></p>
      </form>`;
    L.DomEvent.disableClickPropagation(box);
    L.DomEvent.disableScrollPropagation(box);
    return box;
  },
});
new SearchControl().addTo(map);

let searchItems = [];
const searchOpen = () => !$('search-box').hidden;
function renderSearch() {
  const b = $('search-btn');
  b.title = t(searchOpen() ? 'searchClose' : 'search');
  b.setAttribute('aria-label', b.title);
  $('search-q').placeholder = t('searchPh');
  $('search-q').setAttribute('aria-label', t('search'));
  if (searchOpen()) onSearchInput();                  // a language switch re-renders the local results
}
// msg: the i18n key of the line under the results, or '' for none.
function showResults(items, msg) {
  searchItems = items;
  $('search-res').innerHTML = items.map((it, i) =>
    `<li><button type="button" data-i="${i}"><b>${esc(it.title)}</b>${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</button></li>`).join('');
  $('search-msg').textContent = msg ? t(msg) : '';
}
function setSearchOpen(open) {
  $('search-box').hidden = !open;
  $('search-btn').setAttribute('aria-expanded', String(open));
  renderSearch();
  if (open) { $('search-q').focus(); $('search-q').select(); }
}
// Typing shows only local results. A coordinate pair outside the map shows its message on Enter, not while typing.
function onSearchInput() {
  placeCtl?.abort();
  const q = $('search-q').value;
  if (!q.trim()) return showResults([], 'searchHint');
  showResults(localResults(q) || [], '');
}
async function onSearchSubmit() {
  const q = $('search-q').value.trim();
  if (!q) return;
  const local = localResults(q);
  if (!local) return showResults([], 'searchOut');
  if (local[0] && (local[0].kind === 'point' || local[0].kind === 'sub')) return pickResult(local[0]);
  if (q.length < 3) return showResults(local, local.length ? '' : 'searchNone');
  showResults(local, 'searching');
  const stale = () => $('search-q').value.trim() !== q;   // the field changed during the request
  try {
    const places = await placeResults(q);
    if (stale()) return;
    const items = [...local, ...places];
    showResults(items, items.length ? '' : 'searchNone');
  } catch (err) {
    if (err.name === 'AbortError' || stale()) return;
    showResults(local, 'searchOffline');             // offline, blocked (artifact viewer) or refused by Nominatim
  }
}
function pickResult(it) {
  setSearchOpen(false);
  $('search-btn').focus();
  if (it.kind === 'water') return focusWater(it.id);
  flyThen(() => it.bounds ? map.flyToBounds(it.bounds, {...mapPadding(60), maxZoom: 14, duration: .6})
      : map.flyTo(it.ll, Math.max(map.getZoom(), it.kind === 'sub' ? 11 : 14), {duration: .6}),
    () => it.kind === 'sub' ? openPopup(it.w, it.ll, it.code) : openPointPopup(it.ll, it.kind === 'place' ? it.title : ''));
}

const toggleSearch = e => { e.preventDefault(); setSearchOpen(!searchOpen()); };
$('search-btn').addEventListener('click', toggleSearch);
$('search-btn').addEventListener('keydown', e => { if (e.key === ' ') toggleSearch(e); });   // a role=button link: Space too
$('search-q').addEventListener('input', onSearchInput);
$('search-box').addEventListener('submit', e => { e.preventDefault(); onSearchSubmit(); });
$('search-res').addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) pickResult(searchItems[+b.dataset.i]); });
// Keyboard: arrows move between the field and the results; Escape closes the search.
$('search-box').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); setSearchOpen(false); $('search-btn').focus(); return; }
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const list = [$('search-q'), ...$('search-res').querySelectorAll('button')], i = list.indexOf(document.activeElement);
  if (i < 0 || list.length < 2) return;
  e.preventDefault();
  list[(i + (e.key === 'ArrowDown' ? 1 : list.length - 1)) % list.length].focus();
});
map.on('click', () => { if (searchOpen()) setSearchOpen(false); });

// ---------- basemap: real tiles when the host allows them, built-in vector map otherwise ----------
// The claude.ai artifact sandbox blocks external images, so tiles fail there and the vector layers stay.
// On a normal web host (GitHub Pages), OpenStreetMap standard tiles load and replace the vector base.
// OSM tile policy: visible attribution (already in the attribution control) and a valid Referer (browser default).
// Dark theme: OSM has no dark style, so CSS inverts the tile pane (see .tiles-on rules).
const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19});
tiles.once('tileload', () => {
  tilesOn = true;
  map.getContainer().classList.add('tiles-on');
  map.getPane('base').style.display = 'none';
});
tiles.on('tileerror', () => { if (!tilesOn && map.hasLayer(tiles)) map.removeLayer(tiles); });
tiles.addTo(map);

function styleBase() {
  base.land.setStyle({stroke:true, color:css('--land-edge'), weight:.6, fillColor:css('--land'), fillOpacity:1});
  base.us.setStyle({stroke:true, color:css('--land-edge'), weight:.6, fillColor:css('--us'), fillOpacity:1});
  base.lakes.setStyle({stroke:true, color:css('--river'), weight:.6, fillColor:css('--lake'), fillOpacity:1});
  base.fraser.setStyle({color:css('--river'), weight:4, opacity:1, lineCap:'round'});
}

// Repaint map colors when the viewer switches theme.
const repaint = () => { styleBase(); render(); };
const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
darkMQ.addEventListener('change', () => { repaint(); renderTheme(); });
new MutationObserver(repaint).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

// ---------- theme ----------
// The system theme is the default. A click flips the theme; a choice that equals the system theme
// removes the override, so the page follows the system again.
const sysTheme = () => darkMQ.matches ? 'dark' : 'light';
const curTheme = () => document.documentElement.dataset.theme || sysTheme();
function renderTheme() {
  const next = curTheme() === 'dark' ? 'light' : 'dark';
  const b = $('theme');
  b.dataset.next = next;
  b.title = t(next === 'dark' ? 'themeDark' : 'themeLight');
  b.setAttribute('aria-label', b.title);
  // Browser toolbar color (index.html only): follow the page, not only the system.
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => { m.content = css('--panel'); });
}
$('theme').addEventListener('click', () => {
  const next = $('theme').dataset.next;
  if (next === sysTheme()) { delete document.documentElement.dataset.theme; store.del('theme'); }
  else { document.documentElement.dataset.theme = next; store.set('theme', next); }
  renderTheme();
});

map.on('zoomend', syncZoomClasses);

$('date').value = todayISO();
state.md = $('date').value.slice(5);
styleBase();
applyLang(LANG, false);
const all = L.featureGroup(WATERS.filter(w => !w.tidal && !w.closure).map(w => layers[w.id].line));
map.fitBounds(all.getBounds(), mapPadding(20));
syncZoomClasses();
new ResizeObserver(() => map.invalidateSize()).observe($('map'));
$('legend').open = WIDE.matches;
WIDE.addEventListener('change', () => { layoutSheet(); $('legend').open = WIDE.matches; });
map.on('popupopen', () => { if (!WIDE.matches) { $('legend').open = false; setSheet('peek'); } });
})();
</script>
