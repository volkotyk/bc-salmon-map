name: Update DFO rules and deploy

# Daily and on every push to main:
#   1. dfo/update.py reads the three DFO salmon pages and rebuilds build/rules.json.
#      If DFO shows something the parser does not understand, rules.json stays as it was,
#      build/status.json gets "pending", and an issue is opened (once per new problem).
#   2. Changed rules / status / snapshots are committed back to main.
#   3. build/fetch_reports.py gets the "running now" panel data (DFO and PSC test fisheries,
#      tackle shop reports, Reddit; Instagram, TikTok and Facebook through Apify on the first daily run).
#      A failed source is a warning and keeps its previous data.
#      When the data changed, build/reports.json is committed: git history is the daily snapshot.
#   4. build/fetch_hydro.py gets the water level of the last 14 days at the ECCC gauges of the map rivers.
#      A failed gauge is a warning and keeps its previous data; build/hydro.json is committed with step 3.
#   5. index.html is assembled with the check time and published to GitHub Pages.
#      Before the publish, build/smoke.py opens the page in headless Chrome. When the page script fails at the start,
#      the job stops and the live page stays at the last good version.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 15 * * *'   # 15:23 UTC = 08:23 Pacific daylight time
    - cron: '41 16 * * *'   # 16:41 UTC: second run, because PSC posts the test-fishery PDFs at about 16:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: dfo
        name: Read DFO pages and update rules
        run: python3 dfo/update.py

      - if: steps.dfo.outputs.changed == 'true'
        name: Commit updated rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/rules.json build/status.json dfo/snapshots
          git commit -m "DFO rules update $(date -u +%F)"
          git push

      - if: steps.dfo.outputs.new_block == 'true'
        name: Open an issue (update blocked by the safety check)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create dfo-update --color B42318 --description "DFO rules need a manual check" --force
          tail -n +2 dfo/out/issue.md > body.md
          gh issue create --title "$(head -n 1 dfo/out/issue.md)" --body-file body.md --label dfo-update

      - id: reports
        name: Fetch the running-now data (a failed source keeps its previous data)
        working-directory: build
        env:
          # The Apify scrapers (Instagram, TikTok, Facebook) cost money: only the first daily run and a manual run
          # start them. Other runs get an empty token and keep the social posts of the previous snapshot.
          APIFY_TOKEN: ${{ (github.event.schedule == '23 15 * * *' || github.event_name == 'workflow_dispatch') && secrets.APIFY_TOKEN || '' }}
        run: python3 fetch_reports.py

      - id: hydro
        name: Fetch the water levels (a failed gauge keeps its previous data)
        working-directory: build
        run: python3 fetch_hydro.py

      # The daily snapshot of the running-now data. A failed push does not stop the deploy:
      # the next run finds the same difference and commits it.
      - if: steps.reports.outputs.changed == 'true' || steps.hydro.outputs.changed == 'true'
        name: Commit the running-now snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/reports.json build/hydro.json
          git commit -m "Running-now data $(date -u +%F)"
          git pull --rebase --quiet && git push || echo "::warning::running-now snapshot not pushed; the next run retries"

      - name: Assemble the page
        working-directory: build
        env:
          CHECKED_AT: ${{ steps.dfo.outputs.checked_at }}
        run: python3 run_all.py --page

      - name: Check that the page starts (a broken page is not published)
        working-directory: build
        run: python3 smoke.py

      - name: Collect site files
        run: mkdir _site && cp index.html .nojekyll _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
